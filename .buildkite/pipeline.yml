env:
  CI: "true"
  # The devenv shell includes pi from numtide/llm-agents.nix. Buildkite needs
  # Numtide's binary cache or it may source-build the pi package before tests run.
  NIX_CONFIG: |
    accept-flake-config = true
    extra-substituters = https://cache.numtide.com
    extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=

steps:
  - label: ":gleam: format + unit"
    key: "format-unit"
    agents:
      queue: "hcloud"
    command: |
      set -euo pipefail
      scripts/scherzo-ci-nix-cache
      devenv direnv-export >/dev/null
      direnv allow .
      scripts/scherzo-ci fmt
      scripts/scherzo-ci unit
      scripts/scherzo-ci review-tools

  - label: ":mag: production lint"
    key: "production-lint"
    agents:
      queue: "hcloud"
    command: |
      set -euo pipefail
      scripts/scherzo-ci-nix-cache
      devenv direnv-export >/dev/null
      direnv allow .
      scripts/scherzo-ci lint

  - label: ":shell: contract tests"
    key: "contract-tests"
    agents:
      queue: "hcloud"
    command: |
      set -euo pipefail
      scripts/scherzo-ci-nix-cache
      devenv direnv-export >/dev/null
      direnv allow .
      scripts/scherzo-ci contract

  - label: ":nix: flake + package"
    key: "nix"
    agents:
      queue: "hcloud"
    command: |
      set -euo pipefail
      scripts/scherzo-ci nix
      scripts/scherzo-ci package
