# yaml-language-server: $schema=../schemas/scherzo.config.v1.schema.json
version: 1
tracker:
  linear:
    api_key_env: LINEAR_API_KEY
    endpoint: https://api.linear.app/graphql
    project: YOUR_PROJECT_SLUG
    check_setup: false
    labels:
      support: [needs-workflow, needs-clarification]
  states:
    ready: [Todo]
    active: [Todo, In Progress]
    terminal: [Closed, Cancelled, Canceled, Duplicate, Done]
  polling:
    every: 30s
workspace:
  root: .scherzo/workspaces
  driver: isolated
  drivers:
    isolated:
      type: custom
      command: scherzo-workspace-jj
      timeout: 60s
      # Driver env values are literal strings, not secrets.
      # Uncomment and adjust these examples when this packaged driver should
      # avoid network fetches or use fork/upstream remotes.
      # env:
      #   SCHERZO_JJ_WORKSPACE_BASE: "@"
      #   SCHERZO_JJ_WORKSPACE_FETCH_BASE: "false"
      #   SCHERZO_JJ_WORKSPACE_REMOTE: upstream
      #   SCHERZO_JJ_WORKSPACE_BASE_BRANCH: trunk
      #   SCHERZO_JJ_WORKSPACE_PUBLISH_REMOTE: origin
      #   SCHERZO_GITHUB_REPO: your-org/your-repo
      #   SCHERZO_PR_DRAFT: "true"
agents:
  concurrency: 1
  max_turns: 20
  sessions_per_task: 3
  runtime:
    type: pi
    pi:
      executable: pi
      args: []
    turn_timeout: 1h
    read_timeout: 5s
    stall_timeout: 5m
    auto_retry: true
    ui_requests: cancel
    compatibility_check: true
task_updates:
  enabled: false
  comment_on: [claim, success, failure, park]
  result:
    on_success: comment
    max_chars: 8000
workflows:
  implementation: workflows/implementation.yaml
artifacts:
  limits:
    command_output_chars: 20000
    template_field_chars: 8000
    workflow_summary_chars: 20000
