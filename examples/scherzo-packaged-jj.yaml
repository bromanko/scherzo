version: 1
tracker:
  kind: linear
  credentials:
    api_key_env: LINEAR_API_KEY
  linear:
    endpoint: https://api.linear.app/graphql
    project: YOUR_PROJECT_SLUG
  states:
    ready: [Todo]
    active: [Todo, In Progress]
    terminal: [Closed, Cancelled, Canceled, Duplicate, Done]
  polling:
    every: 30s
workspace:
  root: .scherzo/workspaces
  default_profile: isolated
  profiles:
    isolated:
      driver:
        command: scherzo-workspace-jj
        lifecycle: [create, before-step, after-step, remove]
        timeout_ms: 60000
        # Profile-local driver env values are literal strings, not secrets.
        # Uncomment and adjust these examples when this packaged profile should
        # avoid network fetches or use fork/upstream remotes.
        # env:
        #   SCHERZO_JJ_WORKSPACE_BASE: "@"
        #   SCHERZO_JJ_WORKSPACE_FETCH_BASE: "false"
        #   SCHERZO_JJ_WORKSPACE_REMOTE: upstream
        #   SCHERZO_JJ_WORKSPACE_BASE_BRANCH: trunk
        #   SCHERZO_JJ_WORKSPACE_PUBLISH_REMOTE: origin
        #   SCHERZO_GITHUB_REPO: your-org/your-repo
        #   SCHERZO_PR_DRAFT: "true"
agent:
  max_concurrent_agents: 1
  max_turns: 20
  max_retry_backoff_ms: 300000
  max_retry_attempts: 5
  max_sessions_per_issue: 3
pi:
  command: "pi --mode rpc --no-session --rpc-message-updates off"
  turn_timeout_ms: 3600000
  read_timeout_ms: 5000
  stall_timeout_ms: 300000
  auto_retry: true
  ui_request_policy: cancel
  compatibility_probe: true
task_updates:
  enabled: false
  comment_on: [claim, success, failure, park]
  result:
    on_success: comment
    max_chars: 8000
workflows:
  implementation: workflows/implementation.yaml
artifact_limits:
  command_stream_max_chars: 20000
  template_field_max_chars: 8000
  workflow_summary_max_chars: 20000
linear_contract:
  enabled: false
  workflow_label_prefix: "workflow:"
  workflow_labels: [implementation]
  support_labels: [needs-workflow, needs-clarification]
  required_states:
    todo: Todo
    in_progress: In Progress
    done: Done
    needs_workflow: Needs Workflow
  handoff_state_bindings:
    claim: in_progress
    success: done
    failure: needs_workflow
  enforce_issue_workflow_labels: false
  comment_on_invalid_workflow: false
