# yaml-language-server: $schema=../../schemas/scherzo.workflow.v1.schema.json
version: 1
id: implementation
description: Implement a task, run tests, review in parallel workspaces, apply feedback, and validate.
concurrency: 4
steps:
  - id: implement
    kind: agent
    prompt: prompts/implement.md
    run_in: main

  - id: test_after_implement
    kind: command
    depends_on: [implement]
    run: gleam test
    run_in: main
    on_failure: continue

  - id: code_review
    kind: agent
    depends_on: [implement]
    prompt: prompts/code-review.md
    # Keep the project default model/provider but use more reasoning here.
    thinking: high
    run_in:
      name: code-review
      from: main

  - id: security_review
    kind: agent
    depends_on: [implement]
    prompt: prompts/security-review.md
    run_in:
      name: security-review
      from: main

  - id: performance_review
    kind: agent
    depends_on: [implement]
    prompt: prompts/performance-review.md
    run_in:
      name: performance-review
      from: main

  - id: apply_feedback
    kind: agent
    depends_on:
      - test_after_implement
      - code_review
      - security_review
      - performance_review
    prompt: prompts/apply-feedback.md
    run_in: main

  - id: final_test
    kind: command
    depends_on: [apply_feedback]
    run: gleam test
    run_in: main
