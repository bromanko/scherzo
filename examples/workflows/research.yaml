# yaml-language-server: $schema=../../schemas/scherzo.workflow.v1.schema.json
version: 1
id: research
description: Investigate a task, write one Markdown findings artifact, verify it through the workspace driver, and stream it as the workflow result.
workspace:
  driver: noop
  requires: [assert-only]
concurrency: 1
contract:
  version: 1
  inputs:
    prompt:
      type: text
      required: true
      source: issue_context
    attachments:
      type: artifact[]
      required: false
  outputs:
    findings:
      type: document.markdown
      required: true
      source:
        step: collect_findings
        field: stdout
steps:
  - id: research
    kind: agent
    prompt: prompts/research.md
    run_in: main

  - id: collect_findings
    kind: command
    depends_on: [research]
    recovery:
      attempts: 1
      prompt: prompts/research-recover-failed-step.md
    run: |
      set -eu
      findings=research-findings.md
      driver_command=${SCHERZO_WORKSPACE_DRIVER:?SCHERZO_WORKSPACE_DRIVER is required for the research workflow}
      : "${SCHERZO_CONFIG_DIR:?SCHERZO_CONFIG_DIR is required for relative workspace drivers}"
      case "$driver_command" in
        /*)
          driver=$driver_command
          ;;
        */*)
          if test -x "$SCHERZO_CONFIG_DIR/$driver_command"; then
            driver=$SCHERZO_CONFIG_DIR/$driver_command
          elif test -x "$SCHERZO_CONFIG_DIR/../$driver_command"; then
            driver=$SCHERZO_CONFIG_DIR/../$driver_command
          else
            driver=$driver_command
          fi
          ;;
        *)
          driver=$driver_command
          ;;
      esac
      test -f "$findings"
      "$driver" assert-only --path "$findings"
      cat "$findings"
    run_in: main
