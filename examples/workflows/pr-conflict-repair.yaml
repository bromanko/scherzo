version: 1
id: pr-conflict-repair
description: Detect and repair PR merge conflicts on a fixed cadence.
max_parallel_steps: 1
steps:
  - id: inspect
    kind: command
    run: ./scripts/pr-conflict-repair-inspect.sh
    timeout_ms: 300000
    workspace: main
  - id: repair
    kind: agent
    depends_on: [inspect]
    prompt: prompts/pr-conflict-repair.md
    workspace: main
