version: 1
tracker:
  kind: linear
  endpoint: https://api.linear.app/graphql
  api_key: "$LINEAR_API_KEY"
  project_slug: YOUR_PROJECT_SLUG
  active_states: [Todo, In Progress]
  dispatch_states: [Todo]
  terminal_states: [Closed, Cancelled, Canceled, Duplicate, Done]
polling:
  interval_ms: 30000
workspace:
  root: .scherzo/workspaces
  default_profile: isolated
  profiles:
    isolated:
      hooks:
        create: |
          mkdir -p "$SCHERZO_WORKSPACE_PATH"
          if [ -n "$SCHERZO_SOURCE_WORKSPACE_PATH" ]; then
            rsync -a --delete "$SCHERZO_SOURCE_WORKSPACE_PATH/" "$SCHERZO_WORKSPACE_PATH/"
          elif [ -n "$REPO_URL" ]; then
            git clone "$REPO_URL" "$SCHERZO_WORKSPACE_PATH"
          fi
        before_step: |
          test -d "$SCHERZO_WORKSPACE_PATH"
        after_step: |
          true
        remove: |
          rm -rf "$SCHERZO_WORKSPACE_PATH"
        timeout_ms: 60000
    noop:
      hooks:
        create: |
          set -eu
          mkdir -p "$SCHERZO_WORKSPACE_PATH"
          repo_root=${SCHERZO_REPO_ROOT:-}
          if [ -z "$repo_root" ]; then
            if [ -d "$SCHERZO_CONFIG_DIR/../scripts" ]; then
              repo_root=$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)
            else
              repo_root=$(cd "$SCHERZO_CONFIG_DIR" && pwd -P)
            fi
          fi
          if [ -d "$repo_root/scripts" ] && [ ! -e "$SCHERZO_WORKSPACE_PATH/scripts" ]; then
            ln -s "$repo_root/scripts" "$SCHERZO_WORKSPACE_PATH/scripts"
          fi
        before_step: |
          true
        after_step: |
          true
        remove: |
          rm -rf "$SCHERZO_WORKSPACE_PATH"
        timeout_ms: 60000
      driver:
        command: scripts/scherzo-workspace-noop
        capabilities: [status, changed-files, assert-only]
        timeout_ms: 60000
agent:
  max_concurrent_agents: 1
  max_turns: 20
  max_retry_backoff_ms: 300000
  max_retry_attempts: 5
  max_sessions_per_issue: 3
pi:
  # Default non-persistent launch path. Scherzo uses this shell command while
  # session persistence is disabled.
  command: "pi --mode rpc --no-session"
  # Opt-in persistent launches must use structured argv so Scherzo owns
  # --session construction during recovery. Do not include --session or
  # --no-session here.
  # argv: ["pi", "--mode", "rpc"]
  # session_persistence:
  #   enabled: true
  # Optional project defaults inherited by workflow agent steps.
  # model: google/gemini-2.5-flash
  # thinking: low
  turn_timeout_ms: 3600000
  read_timeout_ms: 5000
  stall_timeout_ms: 300000
  auto_retry: true
  ui_request_policy: cancel
  compatibility_probe: true
handoff:
  enabled: false
  comment_on_claim: true
  comment_on_success: true
  comment_on_failure: true
  comment_on_park: true
  include_result_on_success: true
  result_max_chars: 8000
routing:
  workflow_label_prefix: "workflow:"
  require_exactly_one_workflow_label: true
  workflows:
    research: workflows/research.yaml
    implementation: workflows/implementation.yaml
    pr-conflict-repair: workflows/pr-conflict-repair.yaml
scheduled_jobs:
  - id: pr-conflict-repair
    workflow: pr-conflict-repair
    enabled: true
    every: 15m
    overlap: skip
    catch_up: false
    on_failure:
      linear:
        enabled: true
        state: Triage
        labels:
          - job:pr-conflict-repair
        dedupe: open_issue_per_job
artifact_limits:
  command_stream_max_chars: 20000
  template_field_max_chars: 8000
  workflow_summary_max_chars: 20000
linear_contract:
  enabled: false
  workflow_label_prefix: "workflow:"
  workflow_labels: [research, implementation]
  support_labels: [needs-workflow, needs-clarification]
  required_states:
    todo: Todo
    in_progress: In Progress
    done: Done
    needs_workflow: Needs Workflow
  handoff_state_bindings:
    claim: in_progress
    success: done
    failure: needs_workflow
  enforce_issue_workflow_labels: false
  comment_on_invalid_workflow: false
linear_commands:
  enabled: false
  prefix: "/scherzo"
  authorized_user_ids: []
  poll_limit_per_issue: 25
  max_comments_per_tick: 50
  acknowledge_success: true
  acknowledge_rejection: true
