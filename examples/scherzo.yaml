# yaml-language-server: $schema=../schemas/scherzo.config.v1.schema.json
version: 1
tracker:
  linear:
    api_key_env: LINEAR_API_KEY
    endpoint: https://api.linear.app/graphql
    project: YOUR_PROJECT_SLUG
    check_setup: false
    labels:
      support: [needs-workflow, needs-clarification]
  states:
    ready: [Todo]
    active: [Todo, In Progress]
    terminal: [Closed, Cancelled, Canceled, Duplicate, Done]
  polling:
    every: 30s
workspace:
  root: .scherzo/workspaces
  driver: isolated
  drivers:
    isolated:
      type: custom
      command: ../scripts/scherzo-workspace-jj
      timeout: 60s
      # Driver env values are literal strings, not secrets.
      # Uncomment and adjust these jj base-policy examples when this driver
      # should use a non-default base or remote without a wrapper script.
      # env:
      #   SCHERZO_JJ_WORKSPACE_BASE: "@"
      #   SCHERZO_JJ_WORKSPACE_REMOTE: upstream
      #   SCHERZO_JJ_WORKSPACE_BASE_BRANCH: trunk
    noop:
      type: custom
      command: ../scripts/scherzo-workspace-noop
      timeout: 60s
agents:
  concurrency: 1
  max_turns: 20
  sessions_per_task: 3
  retries:
    max_backoff: 5m
    attempts: 5
  # Optional project defaults inherited by workflow agent steps.
  # model: google/gemini-2.5-flash
  # thinking: low
  runtime:
    type: pi
    sessions: ephemeral
    pi:
      executable: pi
      args: []
    turn_timeout: 1h
    read_timeout: 5s
    stall_timeout: 5m
    auto_retry: true
    ui_requests: cancel
    compatibility_check: true
task_updates:
  enabled: false
  comment_on: [claim, success, failure, park]
  result:
    on_success: comment
    max_chars: 8000
workflows:
  research: workflows/research.yaml
  implementation: workflows/implementation.yaml
  merge-conflict-resolution: workflows/merge-conflict-resolution.yaml
  github-pr-conflict-scout: workflows/github-pr-conflict-scout.yaml
schedules:
  # Disabled by default because the scout can create Linear resolver issues.
  # Set SCHERZO_GITHUB_REPO and SCHERZO_LINEAR_PROJECT_SLUG, then flip to true.
  # The scout scans up to SCHERZO_CONFLICT_MAX_OPEN_PRS open PRs (default 100),
  # defaults to GitHub-only detection, and should use
  # SCHERZO_CONFLICT_ENABLE_LOCAL_PREFLIGHT=true only for known-small repositories.
  - id: github-pr-conflict-scout
    workflow: github-pr-conflict-scout
    enabled: false
    every: 15m
    overlap: skip
    catch_up: false
    on_failure:
      task:
        enabled: true
        state: Triage
        labels:
          - job:github-pr-conflict-scout
        dedupe: open_task_per_schedule
artifacts:
  repositories:
    github:
      code:
        repo: owner/repo
        base: main
  limits:
    command_output_chars: 20000
    template_field_chars: 8000
    workflow_summary_chars: 20000
