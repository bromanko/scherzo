version: 1
tracker:
  kind: linear
  credentials:
    api_key_env: LINEAR_API_KEY
  linear:
    endpoint: https://api.linear.app/graphql
    project: YOUR_PROJECT_SLUG
  states:
    ready: [Todo]
    active: [Todo, In Progress]
    terminal: [Closed, Cancelled, Canceled, Duplicate, Done]
  polling:
    every: 30s
workspace:
  root: .scherzo/workspaces
  default_profile: isolated
  profiles:
    isolated:
      driver:
        command: ../scripts/scherzo-workspace-jj
        lifecycle: [create, before-step, after-step, remove]
        timeout_ms: 60000
        # Profile-local driver env values are literal strings, not secrets.
        # Uncomment and adjust these jj base-policy examples when this profile
        # should use a non-default base or remote without a wrapper script.
        # env:
        #   SCHERZO_JJ_WORKSPACE_BASE: "@"
        #   SCHERZO_JJ_WORKSPACE_REMOTE: upstream
        #   SCHERZO_JJ_WORKSPACE_BASE_BRANCH: trunk
    noop:
      driver:
        command: ../scripts/scherzo-workspace-noop
        lifecycle: [create, before-step, after-step, remove]
        timeout_ms: 60000
agent:
  max_concurrent_agents: 1
  max_turns: 20
  max_retry_backoff_ms: 300000
  max_retry_attempts: 5
  max_sessions_per_issue: 3
pi:
  # Default non-persistent launch path. Scherzo uses this shell command while
  # session persistence is disabled.
  command: "pi --mode rpc --no-session --rpc-message-updates off"
  # Opt-in persistent launches must use structured argv so Scherzo owns
  # --session construction during recovery. Do not include --session or
  # --no-session here.
  # argv: ["pi", "--mode", "rpc", "--rpc-message-updates", "off"]
  # session_persistence:
  #   enabled: true
  # Optional project defaults inherited by workflow agent steps.
  # model: google/gemini-2.5-flash
  # thinking: low
  turn_timeout_ms: 3600000
  read_timeout_ms: 5000
  stall_timeout_ms: 300000
  auto_retry: true
  ui_request_policy: cancel
  compatibility_probe: true
task_updates:
  enabled: false
  comment_on: [claim, success, failure, park]
  result:
    on_success: comment
    max_chars: 8000
workflows:
  research: workflows/research.yaml
  implementation: workflows/implementation.yaml
  merge-conflict-resolution: workflows/merge-conflict-resolution.yaml
  github-pr-conflict-scout: workflows/github-pr-conflict-scout.yaml
scheduled_jobs:
  # Disabled by default because the scout can create Linear resolver issues.
  # Set SCHERZO_GITHUB_REPO and SCHERZO_LINEAR_PROJECT_SLUG, then flip to true.
  # The scout scans up to SCHERZO_CONFLICT_MAX_OPEN_PRS open PRs (default 100),
  # defaults to GitHub-only detection, and should use
  # SCHERZO_CONFLICT_ENABLE_LOCAL_PREFLIGHT=true only for known-small repositories.
  - id: github-pr-conflict-scout
    workflow: github-pr-conflict-scout
    enabled: false
    every: 15m
    overlap: skip
    catch_up: false
    on_failure:
      linear:
        enabled: true
        state: Triage
        labels:
          - job:github-pr-conflict-scout
        dedupe: open_issue_per_job
artifact_limits:
  command_stream_max_chars: 20000
  template_field_max_chars: 8000
  workflow_summary_max_chars: 20000
linear_contract:
  enabled: false
  workflow_label_prefix: "workflow:"
  # Only trusted operators or automation should be able to apply
  # merge-conflict-resolution; that workflow can publish validated fixes.
  workflow_labels: [research, implementation, merge-conflict-resolution]
  support_labels: [needs-workflow, needs-clarification]
  required_states:
    todo: Todo
    in_progress: In Progress
    done: Done
    needs_workflow: Needs Workflow
  handoff_state_bindings:
    claim: in_progress
    success: done
    failure: needs_workflow
  enforce_issue_workflow_labels: false
  comment_on_invalid_workflow: false
