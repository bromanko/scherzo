version: 1
tracker:
  kind: linear
  credentials:
    api_key_env: LINEAR_API_KEY
  linear:
    endpoint: https://api.linear.app/graphql
    project: YOUR_PROJECT_SLUG
  states:
    ready: [Todo]
    active: [Todo, In Progress]
    terminal: [Closed, Cancelled, Canceled, Duplicate, Done]
  polling:
    every: 30s
workspace:
  root: .scherzo/workspaces
  default_profile: noop
  profiles:
    noop:
      driver:
        command: scherzo-workspace-noop
        lifecycle: [create, before-step, after-step, remove]
        timeout_ms: 60000
agents:
  concurrency: 1
  max_turns: 20
  sessions_per_task: 3
  retries:
    max_backoff: 5m
    attempts: 5
  runtime:
    type: pi
    pi:
      executable: pi
      args: []
    turn_timeout: 1h
    read_timeout: 5s
    stall_timeout: 5m
    auto_retry: true
    ui_requests: cancel
    compatibility_check: true
handoff:
  enabled: false
  comment_on_claim: true
  comment_on_success: true
  comment_on_failure: true
  comment_on_park: true
  include_result_on_success: true
  result_max_chars: 8000
workflows:
  research: workflows/research.yaml
artifact_limits:
  command_stream_max_chars: 20000
  template_field_max_chars: 8000
  workflow_summary_max_chars: 20000
linear_contract:
  enabled: false
  workflow_label_prefix: "workflow:"
  workflow_labels: [research]
  support_labels: [needs-workflow, needs-clarification]
  required_states:
    todo: Todo
    in_progress: In Progress
    done: Done
    needs_workflow: Needs Workflow
  handoff_state_bindings:
    claim: in_progress
    success: done
    failure: needs_workflow
  enforce_issue_workflow_labels: false
  comment_on_invalid_workflow: false
