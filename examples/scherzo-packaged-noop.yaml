version: 1
tracker:
  linear:
    api_key_env: LINEAR_API_KEY
    endpoint: https://api.linear.app/graphql
    project: YOUR_PROJECT_SLUG
    check_setup: false
    labels:
      support: [needs-workflow, needs-clarification]
  states:
    ready: [Todo]
    active: [Todo, In Progress]
    terminal: [Closed, Cancelled, Canceled, Duplicate, Done]
  polling:
    every: 30s
workspace:
  root: .scherzo/workspaces
  driver: noop
  drivers:
    noop:
      type: custom
      command: scherzo-workspace-noop
      timeout: 60s
agents:
  concurrency: 1
  max_turns: 20
  sessions_per_task: 3
  retries:
    max_backoff: 5m
    attempts: 5
  runtime:
    type: pi
    pi:
      executable: pi
      args: []
    turn_timeout: 1h
    read_timeout: 5s
    stall_timeout: 5m
    auto_retry: true
    ui_requests: cancel
    compatibility_check: true
task_updates:
  enabled: false
  comment_on: [claim, success, failure, park]
  result:
    on_success: comment
    max_chars: 8000
workflows:
  research: workflows/research.yaml
artifacts:
  limits:
    command_output_chars: 20000
    template_field_chars: 8000
    workflow_summary_chars: 20000
