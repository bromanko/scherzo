name = "scherzo"
version = "1.0.0"
target = "erlang"
description = "A Gleam service that runs pi agents from Linear issues."

# Fill out these fields if you intend to generate HTML documentation or publish
# your project to the Hex package manager.
#
# description = ""
# licences = ["Apache-2.0"]
# repository = { type = "github", user = "", repo = "" }
# links = [{ title = "Website", href = "" }]
#
# For a full reference of all the available options, you can have a look at
# https://gleam.run/writing-gleam/gleam-toml/.

[dependencies]
gleam_stdlib = ">= 0.44.0 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.2.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_http = ">= 4.3.0 and < 5.0.0"
gleam_httpc = ">= 5.0.0 and < 6.0.0"
simplifile = ">= 2.4.0 and < 3.0.0"
yay = ">= 2.0.2 and < 3.0.0"
birl = ">= 2.0.0 and < 3.0.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
glinter = ">= 2.16.0 and < 3.0.0"

[tools.glinter]
# Production gate only. Tests are intentionally excluded from the checked
# glinter run; see docs/runbooks/glinter.md for the test baseline and policy.
include = ["src/"]
exclude = ["test/"]

[tools.glinter.rules]
# Blocking production safety gate from LIV-95.
assert_ok_pattern = "error"
avoid_panic = "error"
avoid_todo = "error"
division_by_zero = "error"

# Ratcheted high-signal production rules from LIV-102.
error_context_lost = "error"
missing_type_annotation = "error"

# Agent-safety warnings tracked by the LIV-101 baseline, still too broad to block.
discarded_result = "warning"
thrown_away_error = "warning"
stringly_typed_error = "warning"

# Deliberately disabled until a follow-up can reduce or scope the noise.
echo = "off"
panic_without_message = "off"
todo_without_message = "off"
string_inspect = "off"
short_variable_name = "off"
unnecessary_variable = "off"
redundant_case = "off"
prefer_guard_clause = "off"
unnecessary_string_concatenation = "off"
trailing_underscore = "off"
label_possible = "off"
missing_labels = "off"
unqualified_import = "off"
duplicate_import = "off"
unused_exports = "off"
deep_nesting = "off"
unwrap_used = "off"
function_complexity = "off"
module_complexity = "off"
ffi_usage = "off"
