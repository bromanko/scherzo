# yaml-language-server: $schema=../../schemas/scherzo.workflow.v1.schema.json
version: 1
id: research
description: Investigate a task, write Markdown findings, verify the findings file, retain it as a local workflow output, and stream it as the Linear result.
workspace:
  driver: dogfood-jj
concurrency: 1
contract:
  version: 1
  outputs:
    findings:
      kind: file
      media_type: text/markdown
      artifact_type: scherzo.research_findings.v1
      required: true
      source:
        step: collect_findings
        field: stdout
steps:
  - id: research
    kind: agent
    prompt: prompts/research.md
    run_in: main

  - id: collect_findings
    kind: command
    depends_on: [research]
    recovery:
      attempts: 1
      prompt: prompts/research-recover-failed-step.md
    run: |
      set -eu
      findings=research-findings.md
      test -f "$findings"
      cat "$findings"

      if command -v jj >/dev/null 2>&1 && jj root >/dev/null 2>&1; then
        changed=$(jj diff --name-only -r @ --color=never)
        changed=$(printf '%s\n' "$changed" | sed '/^[[:space:]]*$/d')
        if [ "$changed" = "$findings" ]; then
          jj abandon @ --color=never >&2
        elif [ -n "$changed" ]; then
          echo "unexpected repository changes after research workflow:" >&2
          printf '%s\n' "$changed" >&2
          exit 1
        fi
      fi
    run_in: main
