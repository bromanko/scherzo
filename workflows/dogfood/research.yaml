version: 1
id: research
description: Investigate a task, write Markdown findings, verify the findings file, and use it as the Linear result artifact.
workspace_profile: dogfood-jj
max_parallel_steps: 1
steps:
  - id: research
    kind: agent
    prompt: prompts/research.md
    workspace: main

  - id: collect_findings
    kind: command
    depends_on: [research]
    recover:
      attempts: 1
      prompt: prompts/research-recover-failed-step.md
    run: |
      set -eu
      findings=research-findings.md
      test -f "$findings"
      cat "$findings"

      if command -v jj >/dev/null 2>&1 && jj root >/dev/null 2>&1; then
        changed=$(jj diff --name-only -r @ --color=never)
        changed=$(printf '%s\n' "$changed" | sed '/^[[:space:]]*$/d')
        if [ "$changed" = "$findings" ]; then
          jj abandon @ --color=never >&2
        elif [ -n "$changed" ]; then
          echo "unexpected repository changes after research workflow:" >&2
          printf '%s\n' "$changed" >&2
          exit 1
        fi
      fi
    workspace: main
