# yaml-language-server: $schema=../../schemas/scherzo.workflow.v1.schema.json
version: 1
id: github-pr-conflict-scout
description: Scan open same-repository GitHub pull requests and enqueue Linear merge-conflict resolver issues.
# Default to noop because merge-tree preflight reads and fetches refs in the
# configured repository without mutating the worktree or needing an isolated
# workflow workspace.
workspace:
  driver: noop
concurrency: 1
steps:
  - id: scan_open_prs
    kind: command
    run: |
      set -eu
      : "${SCHERZO_WORKFLOW_BUNDLE_DIR:?Scherzo command-step contract missing SCHERZO_WORKFLOW_BUNDLE_DIR}"
      repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}
      : "${SCHERZO_GITHUB_REPO:?set SCHERZO_GITHUB_REPO to owner/repo, for example octo-org/octo-repo}"
      linear_project_slug=${SCHERZO_LINEAR_PROJECT_SLUG:-${LINEAR_PROJECT_SLUG:-}}
      if test -z "$linear_project_slug"; then
        echo "set SCHERZO_LINEAR_PROJECT_SLUG or LINEAR_PROJECT_SLUG to your Linear project slug" >&2
        exit 64
      fi
      cd "$repo_root"
      max_open_prs=${SCHERZO_CONFLICT_MAX_OPEN_PRS:-100}
      git_remote=${SCHERZO_CONFLICT_GIT_REMOTE:-origin}
      set -- "$SCHERZO_WORKFLOW_BUNDLE_DIR/scripts/scherzo-github-pr-conflict-scout" scan \
        --repo "$SCHERZO_GITHUB_REPO" \
        --linear-project-slug "$linear_project_slug" \
        --create-state "${SCHERZO_CONFLICT_CREATE_STATE:-Todo}" \
        --workflow-label "${SCHERZO_CONFLICT_WORKFLOW_LABEL:-workflow:merge-conflict-resolution}" \
        --git-remote "$git_remote" \
        --max-open-prs "$max_open_prs"
      "$@"
    timeout: 5m
    run_in: main
