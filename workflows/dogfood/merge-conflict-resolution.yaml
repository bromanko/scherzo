# yaml-language-server: $schema=../../schemas/scherzo.workflow.v1.schema.json
version: 1
id: merge-conflict-resolution
description: Manually resolve merge conflicts on a same-repository GitHub PR or branch without intentional functionality changes.
workspace:
  driver: dogfood-jj
  requires: [status, diff, changed-files, publish-change]
concurrency: 1
steps:
  - id: prepare_target
    kind: command
    run: 'bundle_dir=${SCHERZO_WORKFLOW_BUNDLE_DIR:-}; if [ -z "$bundle_dir" ]; then bundle_dir="$(cd "$SCHERZO_CONFIG_DIR/workflows" && pwd -P)"; fi; repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; "$bundle_dir/scripts/scherzo-merge-conflict" prepare'
    timeout: 5m
    run_in: main

  - id: resolve_conflicts
    kind: agent
    depends_on: [prepare_target]
    prompt: prompts/resolve-merge-conflicts.md
    run_in:
      name: main
      from: main

  - id: validate_resolution
    kind: command
    depends_on: [resolve_conflicts]
    run: 'bundle_dir=${SCHERZO_WORKFLOW_BUNDLE_DIR:-}; if [ -z "$bundle_dir" ]; then bundle_dir="$(cd "$SCHERZO_CONFIG_DIR/workflows" && pwd -P)"; fi; repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; "$bundle_dir/scripts/scherzo-merge-conflict" validate'
    timeout: 5m
    run_in:
      name: main
      from: main

  - id: project_validation
    kind: command
    depends_on: [validate_resolution]
    run: |
      set -eu
      bundle_dir=${SCHERZO_WORKFLOW_BUNDLE_DIR:-}
      if [ -z "$bundle_dir" ]; then
        bundle_dir="$(cd "$SCHERZO_CONFIG_DIR/workflows" && pwd -P)"
      fi
      repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}
      # Repo-local validation for Scherzo dogfood. The helper runs the command
      # with workflow-run-scoped Scherzo variables scrubbed, then records the
      # successful project-validation marker for publish.
      "$bundle_dir/scripts/scherzo-merge-conflict" run-project-validation -- sh -eu -c '
        direnv allow .
        rm -rf test/tmp
        direnv exec . gleam format --check src test
        direnv exec . gleam test
      '
    timeout: 20m
    run_in:
      name: main
      from: main

  - id: publish_resolution
    kind: command
    depends_on: [project_validation]
    run: 'bundle_dir=${SCHERZO_WORKFLOW_BUNDLE_DIR:-}; if [ -z "$bundle_dir" ]; then bundle_dir="$(cd "$SCHERZO_CONFIG_DIR/workflows" && pwd -P)"; fi; repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; "$bundle_dir/scripts/scherzo-merge-conflict" publish'
    timeout: 5m
    run_in:
      name: main
      from: main
