# yaml-language-server: $schema=../../schemas/scherzo.workflow.v1.schema.json
version: 1
id: merge-conflict-resolution
description: Manually resolve merge conflicts on a same-repository GitHub PR or branch without intentional functionality changes.
workspace:
  driver: dogfood-jj
  requires: [status, diff, changed-files, publish-commit-stack]
concurrency: 1
contract:
  version: 1
  outputs:
    merge_target:
      kind: value
      media_type: application/json
      artifact_type: scherzo.github_existing_pr_branch_target.v1
      required: true
      source:
        step: prepare_target
        path: tmp/scherzo-merge-conflict-target.json
    commit_stack:
      kind: commit_stack
      media_type: application/vnd.scherzo.git-commit-stack+json
      artifact_type: scherzo.git_commit_stack.v1
      required: true
      source:
        step: materialize_commit_stack
        path: tmp/scherzo-merge-conflict-commit-stack.json
    resolution_summary:
      kind: file
      media_type: text/markdown
      artifact_type: scherzo.merge_conflict_resolution_summary.v1
      required: false
      source:
        step: validate_resolution
        path: tmp/scherzo-merge-conflict-resolution.md
artifacts:
  publications:
    - id: merge_conflict_resolution_commit_stack
      repository: github.code
      required: true
      mode: commit_stack
      commit_stack:
        select:
          output: commit_stack
      target:
        kind: existing_pr_branch
        source:
          output: merge_target
steps:
  - id: prepare_target
    kind: command
    run: ': "${SCHERZO_WORKFLOW_BUNDLE_DIR:?Scherzo command-step contract missing SCHERZO_WORKFLOW_BUNDLE_DIR}"; "$SCHERZO_WORKFLOW_BUNDLE_DIR/scripts/scherzo-merge-conflict" prepare'
    timeout: 5m
    run_in: main

  - id: resolve_conflicts
    kind: agent
    depends_on: [prepare_target]
    prompt: prompts/resolve-merge-conflicts.md
    run_in:
      name: main
      from: main

  - id: validate_resolution
    kind: command
    depends_on: [resolve_conflicts]
    run: ': "${SCHERZO_WORKFLOW_BUNDLE_DIR:?Scherzo command-step contract missing SCHERZO_WORKFLOW_BUNDLE_DIR}"; "$SCHERZO_WORKFLOW_BUNDLE_DIR/scripts/scherzo-merge-conflict" validate'
    timeout: 5m
    run_in:
      name: main
      from: main

  - id: project_validation
    kind: command
    depends_on: [validate_resolution]
    run: |
      set -eu
      : "${SCHERZO_WORKFLOW_BUNDLE_DIR:?Scherzo command-step contract missing SCHERZO_WORKFLOW_BUNDLE_DIR}"
      # Repo-local validation for Scherzo dogfood. The helper runs the command
      # with workflow-run-scoped Scherzo variables scrubbed, then records the
      # successful project-validation marker for publish.
      "$SCHERZO_WORKFLOW_BUNDLE_DIR/scripts/scherzo-merge-conflict" run-project-validation -- sh -eu -c '
        direnv allow .
        rm -rf test/tmp
        direnv exec . gleam format --check src test
        direnv exec . gleam test
      '
    timeout: 20m
    run_in:
      name: main
      from: main

  - id: materialize_commit_stack
    kind: command
    depends_on: [project_validation]
    run: ': "${SCHERZO_WORKFLOW_BUNDLE_DIR:?Scherzo command-step contract missing SCHERZO_WORKFLOW_BUNDLE_DIR}"; "$SCHERZO_WORKFLOW_BUNDLE_DIR/scripts/scherzo-merge-conflict" publish'
    timeout: 5m
    run_in:
      name: main
      from: main
    recovery:
      enabled: false
