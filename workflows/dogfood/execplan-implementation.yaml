# yaml-language-server: $schema=../../schemas/scherzo.workflow.v1.schema.json
version: 1
id: execplan-implementation
description: Validate an ExecPlan bundle, implement from the prepared review doc and implementation pack, run plan-completion and native review gates, publish a PR, and emit a code_change_bundle.
workspace:
  driver: dogfood-jj
  requires: [status, diff, changed-files, baseline, refresh-base, publish-commit-stack]
concurrency: 4
recovery:
  attempts: 1
  prompt: prompts/execplan-implementation-recover-failed-step.md
contract:
  version: 1
  inputs:
    exec_plan_bundle:
      kind: artifact_set
      media_type: application/json
      artifact_type: scherzo.exec_plan_bundle.v2
      required: false
      source: mapped_output
  outputs:
    code_change_bundle:
      kind: artifact_set
      media_type: application/json
      artifact_type: scherzo.code_change_bundle.v2
      source:
        step: materialize_code_change_bundle
        path: state/implementation/execplan-code-change-bundle.json
    commit_stack:
      kind: commit_stack
      media_type: application/vnd.scherzo.git-commit-stack+json
      artifact_type: scherzo.git_commit_stack.v1
      source:
        step: materialize_commit_stack
        path: state/implementation/scherzo-implementation-commit-stack.json
workstream_phase:
  phase_id: implementation
  display_name: ExecPlan implemented, reviewed, validated, and published
  handoff:
    output: code_change_bundle
    artifact_type: scherzo.handoff.v1
    snapshot: required
  gates: [implementation_review, validation_proof, publish_pr]
  final_phase: false
artifacts:
  publications:
    - id: implementation_commit_stack
      repository: github.code
      required: true
      mode: commit_stack
      commit_stack:
        select:
          output: commit_stack
      target:
        kind: stable_branch
steps:
  - id: prepare_bundle
    kind: command
    run: ': "${SCHERZO_WORKFLOW_BUNDLE_DIR:?Scherzo command-step contract missing SCHERZO_WORKFLOW_BUNDLE_DIR}"; "$SCHERZO_WORKFLOW_BUNDLE_DIR/scripts/scherzo-execplan" implementation-prepare --prefer-workstream-input'
    timeout: 5m
    run_in: main

  - id: refresh_base_before_implementation
    kind: command
    depends_on: [prepare_bundle]
    run: ': "${SCHERZO_WORKFLOW_BUNDLE_DIR:?Scherzo command-step contract missing SCHERZO_WORKFLOW_BUNDLE_DIR}"; "$SCHERZO_WORKFLOW_BUNDLE_DIR/scripts/scherzo-implementation" refresh-base --stage before-implementation'
    timeout: 5m
    run_in: main

  - id: implement_plan
    kind: agent
    depends_on: [refresh_base_before_implementation]
    prompt: prompts/execplan-implementation-implement.md
    model: openai-codex/gpt-5.4
    thinking: medium
    run_in: main

  - id: gate_no_conflict
    kind: command
    depends_on: [implement_plan]
    run: ': "${SCHERZO_WORKFLOW_BUNDLE_DIR:?Scherzo command-step contract missing SCHERZO_WORKFLOW_BUNDLE_DIR}"; "$SCHERZO_WORKFLOW_BUNDLE_DIR/scripts/scherzo-execplan" gate-no-conflict'
    run_in: main

  - id: analyze_changes
    kind: command
    depends_on: [gate_no_conflict]
    run: ': "${SCHERZO_WORKFLOW_BUNDLE_DIR:?Scherzo command-step contract missing SCHERZO_WORKFLOW_BUNDLE_DIR}"; "$SCHERZO_WORKFLOW_BUNDLE_DIR/scripts/scherzo-implementation" analyze'
    run_in: main

  - id: verify_plan_completion
    kind: agent
    depends_on: [analyze_changes]
    prompt: prompts/execplan-implementation-verify-completion.md
    structured_output:
      format: json
      artifact_name: plan_completion_verdict_submission
      source:
        type: pi_tool_call
        tool_name: submit_plan_completion_verdict
        parameters_schema_path: .scherzo/workflows/schemas/provider/plan-completion-verdict-submission.v1.schema.json
      required: true
      validators:
        - name: plan_completion_verdict_submission_provider_shape
          type: json_schema
          path: .scherzo/workflows/schemas/provider/plan-completion-verdict-submission.v1.schema.json
          draft: "2020-12"
        - name: plan_completion_verdict_submission_schema
          type: json_schema
          path: .scherzo/workflows/schemas/plan-completion-verdict-submission.v1.schema.json
          draft: "2020-12"
      schema:
        type: object
        required:
          - verdict
          - blocking_findings
          - evidence
          - checked_acceptance_criteria
          - deferred_manual_verification
    run_in: main

  - id: checkpoint_initial_plan_completion_verdict
    kind: command
    depends_on: [verify_plan_completion]
    run: ': "${SCHERZO_WORKFLOW_BUNDLE_DIR:?Scherzo command-step contract missing SCHERZO_WORKFLOW_BUNDLE_DIR}"; "$SCHERZO_WORKFLOW_BUNDLE_DIR/scripts/scherzo-implementation" checkpoint-plan-completion-verdict --submission-step verify_plan_completion'
    run_in: main

  - id: apply_plan_completion_feedback
    kind: agent
    depends_on: [checkpoint_initial_plan_completion_verdict]
    prompt: prompts/execplan-implementation-apply-plan-completion-feedback.md
    model: openai-codex/gpt-5.4
    thinking: medium
    run_in: main

  - id: analyze_changes_after_plan_feedback
    kind: command
    depends_on: [apply_plan_completion_feedback]
    run: ': "${SCHERZO_WORKFLOW_BUNDLE_DIR:?Scherzo command-step contract missing SCHERZO_WORKFLOW_BUNDLE_DIR}"; "$SCHERZO_WORKFLOW_BUNDLE_DIR/scripts/scherzo-implementation" analyze'
    run_in: main

  - id: verify_plan_completion_after_feedback
    kind: agent
    depends_on: [analyze_changes_after_plan_feedback]
    prompt: prompts/execplan-implementation-verify-completion-after-feedback.md
    structured_output:
      format: json
      artifact_name: plan_completion_verdict_submission
      source:
        type: pi_tool_call
        tool_name: submit_plan_completion_verdict
        parameters_schema_path: .scherzo/workflows/schemas/provider/plan-completion-verdict-submission.v1.schema.json
      required: true
      validators:
        - name: plan_completion_verdict_submission_provider_shape
          type: json_schema
          path: .scherzo/workflows/schemas/provider/plan-completion-verdict-submission.v1.schema.json
          draft: "2020-12"
        - name: plan_completion_verdict_submission_schema
          type: json_schema
          path: .scherzo/workflows/schemas/plan-completion-verdict-submission.v1.schema.json
          draft: "2020-12"
      schema:
        type: object
        required:
          - verdict
          - blocking_findings
          - evidence
          - checked_acceptance_criteria
          - deferred_manual_verification
    run_in: main

  - id: checkpoint_plan_completion_verdict_after_feedback
    kind: command
    depends_on: [verify_plan_completion_after_feedback]
    run: ': "${SCHERZO_WORKFLOW_BUNDLE_DIR:?Scherzo command-step contract missing SCHERZO_WORKFLOW_BUNDLE_DIR}"; "$SCHERZO_WORKFLOW_BUNDLE_DIR/scripts/scherzo-implementation" checkpoint-plan-completion-verdict --submission-step verify_plan_completion_after_feedback'
    run_in: main

  - id: gate_plan_completion
    kind: command
    depends_on: [checkpoint_plan_completion_verdict_after_feedback]
    run: ': "${SCHERZO_WORKFLOW_BUNDLE_DIR:?Scherzo command-step contract missing SCHERZO_WORKFLOW_BUNDLE_DIR}"; "$SCHERZO_WORKFLOW_BUNDLE_DIR/scripts/scherzo-implementation" gate-plan-completion'
    on_failure: continue
    run_in: main

  - id: classify_plan_completion_gate
    kind: command
    depends_on: [gate_plan_completion]
    run: ': "${SCHERZO_WORKFLOW_BUNDLE_DIR:?Scherzo command-step contract missing SCHERZO_WORKFLOW_BUNDLE_DIR}"; "$SCHERZO_WORKFLOW_BUNDLE_DIR/scripts/scherzo-implementation" plan-completion-recovery --phase before-late-repair --attempt 2 --max-attempts 3'
    run_in: main

  - id: apply_late_plan_completion_feedback
    kind: agent
    depends_on: [classify_plan_completion_gate]
    prompt: prompts/execplan-implementation-apply-late-plan-completion-feedback.md
    model: openai-codex/gpt-5.4
    thinking: medium
    run_in: main

  - id: analyze_changes_after_late_plan_feedback
    kind: command
    depends_on: [apply_late_plan_completion_feedback]
    run: ': "${SCHERZO_WORKFLOW_BUNDLE_DIR:?Scherzo command-step contract missing SCHERZO_WORKFLOW_BUNDLE_DIR}"; "$SCHERZO_WORKFLOW_BUNDLE_DIR/scripts/scherzo-implementation" analyze'
    run_in: main

  - id: verify_plan_completion_after_late_repair
    kind: agent
    depends_on: [analyze_changes_after_late_plan_feedback]
    prompt: prompts/execplan-implementation-verify-completion-after-late-repair.md
    structured_output:
      format: json
      artifact_name: plan_completion_verdict_submission
      source:
        type: pi_tool_call
        tool_name: submit_plan_completion_verdict
        parameters_schema_path: .scherzo/workflows/schemas/provider/plan-completion-verdict-submission.v1.schema.json
      required: true
      validators:
        - name: plan_completion_verdict_submission_provider_shape
          type: json_schema
          path: .scherzo/workflows/schemas/provider/plan-completion-verdict-submission.v1.schema.json
          draft: "2020-12"
        - name: plan_completion_verdict_submission_schema
          type: json_schema
          path: .scherzo/workflows/schemas/plan-completion-verdict-submission.v1.schema.json
          draft: "2020-12"
      schema:
        type: object
        required:
          - verdict
          - blocking_findings
          - evidence
          - checked_acceptance_criteria
          - deferred_manual_verification
    run_in: main

  - id: checkpoint_plan_completion_verdict_after_late_repair
    kind: command
    depends_on: [verify_plan_completion_after_late_repair]
    run: ': "${SCHERZO_WORKFLOW_BUNDLE_DIR:?Scherzo command-step contract missing SCHERZO_WORKFLOW_BUNDLE_DIR}"; "$SCHERZO_WORKFLOW_BUNDLE_DIR/scripts/scherzo-implementation" checkpoint-plan-completion-verdict --submission-step verify_plan_completion_after_late_repair'
    run_in: main

  - id: gate_plan_completion_after_late_repair
    kind: command
    depends_on: [checkpoint_plan_completion_verdict_after_late_repair]
    run: ': "${SCHERZO_WORKFLOW_BUNDLE_DIR:?Scherzo command-step contract missing SCHERZO_WORKFLOW_BUNDLE_DIR}"; "$SCHERZO_WORKFLOW_BUNDLE_DIR/scripts/scherzo-implementation" gate-plan-completion'
    on_failure: continue
    run_in: main

  - id: classify_plan_completion_gate_after_late_repair
    kind: command
    depends_on: [gate_plan_completion_after_late_repair]
    run: ': "${SCHERZO_WORKFLOW_BUNDLE_DIR:?Scherzo command-step contract missing SCHERZO_WORKFLOW_BUNDLE_DIR}"; "$SCHERZO_WORKFLOW_BUNDLE_DIR/scripts/scherzo-implementation" plan-completion-recovery --phase before-final-repair --attempt 3 --max-attempts 3'
    run_in: main

  - id: apply_final_plan_completion_feedback
    kind: agent
    depends_on: [classify_plan_completion_gate_after_late_repair]
    prompt: prompts/execplan-implementation-apply-final-plan-completion-feedback.md
    model: openai-codex/gpt-5.4
    thinking: medium
    run_in: main

  - id: analyze_changes_after_final_plan_feedback
    kind: command
    depends_on: [apply_final_plan_completion_feedback]
    run: ': "${SCHERZO_WORKFLOW_BUNDLE_DIR:?Scherzo command-step contract missing SCHERZO_WORKFLOW_BUNDLE_DIR}"; "$SCHERZO_WORKFLOW_BUNDLE_DIR/scripts/scherzo-implementation" analyze'
    run_in: main

  - id: verify_plan_completion_after_final_repair
    kind: agent
    depends_on: [analyze_changes_after_final_plan_feedback]
    prompt: prompts/execplan-implementation-verify-completion-after-final-repair.md
    structured_output:
      format: json
      artifact_name: plan_completion_verdict_submission
      source:
        type: pi_tool_call
        tool_name: submit_plan_completion_verdict
        parameters_schema_path: .scherzo/workflows/schemas/provider/plan-completion-verdict-submission.v1.schema.json
      required: true
      validators:
        - name: plan_completion_verdict_submission_provider_shape
          type: json_schema
          path: .scherzo/workflows/schemas/provider/plan-completion-verdict-submission.v1.schema.json
          draft: "2020-12"
        - name: plan_completion_verdict_submission_schema
          type: json_schema
          path: .scherzo/workflows/schemas/plan-completion-verdict-submission.v1.schema.json
          draft: "2020-12"
      schema:
        type: object
        required:
          - verdict
          - blocking_findings
          - evidence
          - checked_acceptance_criteria
          - deferred_manual_verification
    run_in: main

  - id: checkpoint_plan_completion_verdict_after_final_repair
    kind: command
    depends_on: [verify_plan_completion_after_final_repair]
    run: ': "${SCHERZO_WORKFLOW_BUNDLE_DIR:?Scherzo command-step contract missing SCHERZO_WORKFLOW_BUNDLE_DIR}"; "$SCHERZO_WORKFLOW_BUNDLE_DIR/scripts/scherzo-implementation" checkpoint-plan-completion-verdict --submission-step verify_plan_completion_after_final_repair'
    run_in: main

  - id: gate_plan_completion_after_final_repair
    kind: command
    depends_on: [checkpoint_plan_completion_verdict_after_final_repair]
    run: ': "${SCHERZO_WORKFLOW_BUNDLE_DIR:?Scherzo command-step contract missing SCHERZO_WORKFLOW_BUNDLE_DIR}"; "$SCHERZO_WORKFLOW_BUNDLE_DIR/scripts/scherzo-implementation" gate-plan-completion'
    on_failure: continue
    run_in: main

  - id: finalize_plan_completion_gate_recovery
    kind: command
    depends_on: [gate_plan_completion_after_final_repair]
    run: ': "${SCHERZO_WORKFLOW_BUNDLE_DIR:?Scherzo command-step contract missing SCHERZO_WORKFLOW_BUNDLE_DIR}"; "$SCHERZO_WORKFLOW_BUNDLE_DIR/scripts/scherzo-implementation" plan-completion-recovery --phase after-final-repair --attempt 3 --max-attempts 3'
    run_in: main
    recovery:
      enabled: false

  - id: validate_before_native_review
    kind: command
    depends_on: [finalize_plan_completion_gate_recovery]
    run: ': "${SCHERZO_WORKFLOW_BUNDLE_DIR:?Scherzo command-step contract missing SCHERZO_WORKFLOW_BUNDLE_DIR}"; "$SCHERZO_WORKFLOW_BUNDLE_DIR/scripts/scherzo-implementation" validate'
    timeout: 20m
    on_failure: continue
    run_in: main

  - id: prepare_review
    kind: command
    depends_on: [validate_before_native_review]
    run: ': "${SCHERZO_WORKFLOW_BUNDLE_DIR:?Scherzo command-step contract missing SCHERZO_WORKFLOW_BUNDLE_DIR}"; output_dir="$SCHERZO_RUN_ROOT/artifacts/review/prepare_review"; dirty_tree_dir="$SCHERZO_RUN_ROOT/artifacts/review/dirty_tree"; cutover_contract_dir="$SCHERZO_RUN_ROOT/artifacts/review/cutover_contract"; if [ -f "$SCHERZO_RUN_ROOT/input.diff" ]; then "$SCHERZO_WORKFLOW_BUNDLE_DIR/scripts/scherzo-review" prepare-native --diff-file "$SCHERZO_RUN_ROOT/input.diff" --output-dir "$output_dir" --source-label "execplan-implementation-native" --validation-result state/implementation/scherzo-implementation-validation.json --validation-log-ref .scherzo/command-step-diagnostics/validate_before_native_review.txt --dirty-tree-dir "$dirty_tree_dir" --cutover-contract-dir "$cutover_contract_dir"; else "$SCHERZO_WORKFLOW_BUNDLE_DIR/scripts/scherzo-review" prepare-native --from "${SCHERZO_REVIEW_FROM:-@-}" --to "${SCHERZO_REVIEW_TO:-@}" --output-dir "$output_dir" --source-label "execplan-implementation-native" --validation-result state/implementation/scherzo-implementation-validation.json --validation-log-ref .scherzo/command-step-diagnostics/validate_before_native_review.txt --dirty-tree-dir "$dirty_tree_dir" --cutover-contract-dir "$cutover_contract_dir"; fi'
    timeout: 5m
    run_in: main


  - id: lane_correctness
    kind: agent
    depends_on: [prepare_review]
    prompt: prompts/review-native-correctness.md
    on_failure: continue
    run_in:
      name: review-correctness
      from: main
    structured_output:
      format: json
      artifact_name: correctness_submission
      source:
        type: pi_tool_call
        tool_name: submit_review_lane_draft
        parameters_schema_path: .scherzo/workflows/schemas/provider/review-lane-draft.correctness.v1.schema.json
      required: true
      validators:
        - name: review_lane_submission_shape
          type: json_schema
          path: .scherzo/workflows/schemas/provider/review-lane-draft.correctness.v1.schema.json
          draft: "2020-12"
      schema:
        type: object
        required:
          - draft_findings
          - review_notes
          - evidence_requests
          - self_check

  - id: lane_test_quality
    kind: agent
    depends_on: [prepare_review]
    prompt: prompts/review-native-test-quality.md
    model: openai-codex/gpt-5.4
    thinking: medium
    on_failure: continue
    run_in:
      name: review-test-quality
      from: main
    structured_output:
      format: json
      artifact_name: test_quality_submission
      source:
        type: pi_tool_call
        tool_name: submit_review_lane_draft
        parameters_schema_path: .scherzo/workflows/schemas/provider/review-lane-draft.test-quality.v1.schema.json
      required: true
      validators:
        - name: review_lane_submission_shape
          type: json_schema
          path: .scherzo/workflows/schemas/provider/review-lane-draft.test-quality.v1.schema.json
          draft: "2020-12"
      schema:
        type: object
        required:
          - draft_findings
          - review_notes
          - evidence_requests
          - self_check

  - id: lane_idioms_maintainability
    kind: agent
    depends_on: [prepare_review]
    prompt: prompts/review-native-idioms-maintainability.md
    model: openai-codex/gpt-5.4
    thinking: medium
    on_failure: continue
    run_in:
      name: review-idioms-maintainability
      from: main
    structured_output:
      format: json
      artifact_name: idioms_maintainability_submission
      source:
        type: pi_tool_call
        tool_name: submit_review_lane_draft
        parameters_schema_path: .scherzo/workflows/schemas/provider/review-lane-draft.idioms-maintainability.v1.schema.json
      required: true
      validators:
        - name: review_lane_submission_shape
          type: json_schema
          path: .scherzo/workflows/schemas/provider/review-lane-draft.idioms-maintainability.v1.schema.json
          draft: "2020-12"
      schema:
        type: object
        required:
          - draft_findings
          - review_notes
          - evidence_requests
          - self_check

  - id: lane_security_performance
    kind: agent
    depends_on: [prepare_review]
    prompt: prompts/review-native-security-performance.md
    on_failure: continue
    run_in:
      name: review-security-performance
      from: main
    structured_output:
      format: json
      artifact_name: security_performance_submission
      source:
        type: pi_tool_call
        tool_name: submit_review_lane_draft
        parameters_schema_path: .scherzo/workflows/schemas/provider/review-lane-draft.security-performance.v1.schema.json
      required: true
      validators:
        - name: review_lane_submission_shape
          type: json_schema
          path: .scherzo/workflows/schemas/provider/review-lane-draft.security-performance.v1.schema.json
          draft: "2020-12"
      schema:
        type: object
        required:
          - draft_findings
          - review_notes
          - evidence_requests
          - self_check

  - id: finalize_lanes
    kind: command
    depends_on: [lane_correctness, lane_test_quality, lane_idioms_maintainability, lane_security_performance]
    run: ': "${SCHERZO_WORKFLOW_BUNDLE_DIR:?Scherzo command-step contract missing SCHERZO_WORKFLOW_BUNDLE_DIR}"; : "${SCHERZO_RUN_ARTIFACT_DIR:?Scherzo command-step contract missing SCHERZO_RUN_ARTIFACT_DIR}"; "$SCHERZO_WORKFLOW_BUNDLE_DIR/scripts/scherzo-review" finalize-lanes --prepare-dir "$SCHERZO_RUN_ROOT/artifacts/review/prepare_review" --review-root "$SCHERZO_RUN_ROOT/artifacts/review" --dirty-tree-dir "$SCHERZO_RUN_ROOT/artifacts/review/dirty_tree" --artifact-dir "$SCHERZO_RUN_ARTIFACT_DIR" --synthesis-output-dir "$SCHERZO_RUN_ROOT/artifacts/review/synthesize_review" --lane correctness --lane test-quality --lane idioms-maintainability --lane security-performance'
    run_in: main

  # Targeted remediation consumes synthesized native review findings; this is not a second broad review pass.
  - id: apply_review_feedback
    kind: agent
    depends_on: [finalize_lanes]
    prompt: prompts/execplan-implementation-apply-feedback.md
    model: openai-codex/gpt-5.4
    thinking: medium
    run_in: main
    structured_output:
      format: json
      artifact_name: review_finding_disposition_input
      source:
        type: pi_tool_call
        tool_name: submit_review_finding_dispositions
        parameters_schema_path: .scherzo/workflows/schemas/provider/review-finding-dispositions.v1.schema.json
      required: true
      validators:
        - name: review_finding_disposition_input_semantics
          type: command
          argv:
            - python3
            - .scherzo/workflows/scripts/scherzo-review
            - validate-structured-output
            - --validator
            - review_finding_disposition_input
          working_directory: repository
          timeout: 30s
        - name: review_finding_disposition_provider_shape
          type: json_schema
          path: .scherzo/workflows/schemas/provider/review-finding-dispositions.v1.schema.json
          draft: "2020-12"
        - name: review_finding_disposition_input_schema
          type: json_schema
          path: .scherzo/workflows/schemas/review-finding-disposition-input.v1.schema.json
          draft: "2020-12"
      schema:
        type: object
        required:
          - schema_version
          - artifact_type
          - entries

  - id: materialize_review_dispositions
    kind: command
    depends_on: [apply_review_feedback]
    run: ': "${SCHERZO_WORKFLOW_BUNDLE_DIR:?Scherzo command-step contract missing SCHERZO_WORKFLOW_BUNDLE_DIR}"; : "${SCHERZO_RUN_ARTIFACT_DIR:?Scherzo command-step contract missing SCHERZO_RUN_ARTIFACT_DIR}"; "$SCHERZO_WORKFLOW_BUNDLE_DIR/scripts/scherzo-review" materialize-disposition-input --artifact-dir "$SCHERZO_RUN_ARTIFACT_DIR" --submission-step apply_review_feedback --submission-artifact review_finding_disposition_input --output tmp/review-finding-dispositions.v1.json'
    run_in: main

  - id: refresh_base_before_validation
    kind: command
    depends_on: [materialize_review_dispositions]
    run: ': "${SCHERZO_WORKFLOW_BUNDLE_DIR:?Scherzo command-step contract missing SCHERZO_WORKFLOW_BUNDLE_DIR}"; "$SCHERZO_WORKFLOW_BUNDLE_DIR/scripts/scherzo-implementation" refresh-base --stage before-validation'
    timeout: 5m
    on_failure: continue
    run_in: main

  - id: validate_after_refresh
    kind: command
    depends_on: [refresh_base_before_validation]
    run: ': "${SCHERZO_WORKFLOW_BUNDLE_DIR:?Scherzo command-step contract missing SCHERZO_WORKFLOW_BUNDLE_DIR}"; "$SCHERZO_WORKFLOW_BUNDLE_DIR/scripts/scherzo-implementation" validate'
    timeout: 20m
    on_failure: continue
    run_in: main

  - id: repair_base_drift
    kind: agent
    depends_on: [validate_after_refresh]
    prompt: prompts/execplan-implementation-repair-base-drift.md
    run_in: main

  - id: assert_base_drift_repair
    kind: command
    depends_on: [repair_base_drift]
    run: ': "${SCHERZO_WORKFLOW_BUNDLE_DIR:?Scherzo command-step contract missing SCHERZO_WORKFLOW_BUNDLE_DIR}"; "$SCHERZO_WORKFLOW_BUNDLE_DIR/scripts/scherzo-implementation" assert-base-drift-repair'
    run_in: main

  - id: verify_plan_completion_before_final_validation
    kind: agent
    depends_on: [assert_base_drift_repair]
    prompt: prompts/execplan-implementation-verify-completion-before-final-validation.md
    structured_output:
      format: json
      artifact_name: plan_completion_verdict_submission
      source:
        type: pi_tool_call
        tool_name: submit_plan_completion_verdict
        parameters_schema_path: .scherzo/workflows/schemas/provider/plan-completion-verdict-submission.v1.schema.json
      required: true
      validators:
        - name: plan_completion_verdict_submission_provider_shape
          type: json_schema
          path: .scherzo/workflows/schemas/provider/plan-completion-verdict-submission.v1.schema.json
          draft: "2020-12"
        - name: plan_completion_verdict_submission_schema
          type: json_schema
          path: .scherzo/workflows/schemas/plan-completion-verdict-submission.v1.schema.json
          draft: "2020-12"
      schema:
        type: object
        required:
          - verdict
          - blocking_findings
          - evidence
          - checked_acceptance_criteria
          - deferred_manual_verification
    run_in: main

  - id: checkpoint_final_plan_completion_verdict
    kind: command
    depends_on: [verify_plan_completion_before_final_validation]
    run: ': "${SCHERZO_WORKFLOW_BUNDLE_DIR:?Scherzo command-step contract missing SCHERZO_WORKFLOW_BUNDLE_DIR}"; "$SCHERZO_WORKFLOW_BUNDLE_DIR/scripts/scherzo-implementation" checkpoint-plan-completion-verdict --submission-step verify_plan_completion_before_final_validation'
    run_in: main

  - id: final_validate
    kind: command
    depends_on: [checkpoint_final_plan_completion_verdict]
    run: ': "${SCHERZO_WORKFLOW_BUNDLE_DIR:?Scherzo command-step contract missing SCHERZO_WORKFLOW_BUNDLE_DIR}"; "$SCHERZO_WORKFLOW_BUNDLE_DIR/scripts/scherzo-implementation" validate'
    timeout: 20m
    run_in: main

  - id: final_plan_completion_gate
    kind: command
    depends_on: [final_validate]
    run: ': "${SCHERZO_WORKFLOW_BUNDLE_DIR:?Scherzo command-step contract missing SCHERZO_WORKFLOW_BUNDLE_DIR}"; "$SCHERZO_WORKFLOW_BUNDLE_DIR/scripts/scherzo-implementation" gate-plan-completion --final'
    on_failure: continue
    run_in: main

  - id: finalize_final_plan_completion_gate
    kind: command
    depends_on: [final_plan_completion_gate]
    run: ': "${SCHERZO_WORKFLOW_BUNDLE_DIR:?Scherzo command-step contract missing SCHERZO_WORKFLOW_BUNDLE_DIR}"; "$SCHERZO_WORKFLOW_BUNDLE_DIR/scripts/scherzo-implementation" plan-completion-recovery --phase final --attempt 3 --max-attempts 3'
    run_in: main
    recovery:
      enabled: false

  - id: finalize_review_dispositions
    kind: command
    depends_on: [final_validate]
    run: ': "${SCHERZO_WORKFLOW_BUNDLE_DIR:?Scherzo command-step contract missing SCHERZO_WORKFLOW_BUNDLE_DIR}"; diff_path=""; if [ -f "$SCHERZO_RUN_ROOT/input.diff" ]; then diff_path=" --diff-file $SCHERZO_RUN_ROOT/input.diff"; fi; "$SCHERZO_WORKFLOW_BUNDLE_DIR/scripts/scherzo-review" finalize-dispositions --final-review "$SCHERZO_RUN_ROOT/artifacts/review/synthesize_review/final-review.v1.json" --disposition-input tmp/review-finding-dispositions.v1.json --validation-artifact state/implementation/scherzo-implementation-validation.json --output-dir "$SCHERZO_RUN_ROOT/artifacts/review/final_dispositions" --require-publishable${diff_path}'
    run_in: main

  - id: materialize_commit_stack
    kind: command
    depends_on: [finalize_final_plan_completion_gate, finalize_review_dispositions]
    run: ': "${SCHERZO_WORKFLOW_BUNDLE_DIR:?Scherzo command-step contract missing SCHERZO_WORKFLOW_BUNDLE_DIR}"; "$SCHERZO_WORKFLOW_BUNDLE_DIR/scripts/scherzo-implementation" publish'
    timeout: 20m
    run_in: main
    recovery:
      enabled: false

  - id: materialize_code_change_bundle
    kind: command
    depends_on: [materialize_commit_stack]
    run: ': "${SCHERZO_WORKFLOW_BUNDLE_DIR:?Scherzo command-step contract missing SCHERZO_WORKFLOW_BUNDLE_DIR}"; bundle_path="$SCHERZO_RUN_ROOT/state/implementation/execplan-bundle.json"; "$SCHERZO_WORKFLOW_BUNDLE_DIR/scripts/scherzo-execplan" materialize-code-change-bundle --bundle "$bundle_path" --output "$SCHERZO_RUN_ROOT/state/implementation/execplan-code-change-bundle.json"'
    run_in: main
    recovery:
      enabled: false
