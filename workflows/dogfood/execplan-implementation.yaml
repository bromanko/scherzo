# yaml-language-server: $schema=../../schemas/scherzo.workflow.v1.schema.json
version: 1
id: execplan-implementation
description: Validate an ExecPlan bundle, implement from the prepared review doc and implementation pack, run plan-completion and native review gates, publish a PR, and emit a code_change_bundle.
workspace:
  driver: dogfood-jj
  requires: [status, diff, changed-files, baseline, refresh-base, publish-commit-stack]
concurrency: 4
recovery:
  attempts: 1
  prompt: prompts/execplan-implementation-recover-failed-step.md
contract:
  version: 1
  inputs:
    exec_plan_bundle:
      kind: artifact_set
      media_type: application/json
      artifact_type: scherzo.exec_plan_bundle.v2
      required: false
      source: mapped_output
  outputs:
    code_change_bundle:
      kind: artifact_set
      media_type: application/json
      artifact_type: scherzo.code_change_bundle.v2
      source:
        step: materialize_code_change_bundle
        path: tmp/execplan-code-change-bundle.json
    commit_stack:
      kind: commit_stack
      media_type: application/vnd.scherzo.git-commit-stack+json
      artifact_type: scherzo.git_commit_stack.v1
      source:
        step: materialize_commit_stack
        path: tmp/scherzo-implementation-commit-stack.json
workstream_phase:
  phase_id: implementation
  display_name: ExecPlan implemented, reviewed, validated, and published
  handoff:
    output: code_change_bundle
    artifact_type: scherzo.handoff.v1
    snapshot: required
  gates: [implementation_review, validation_proof, publish_pr]
  final_phase: false
artifacts:
  publications:
    - id: implementation_commit_stack
      repository: github.code
      required: true
      mode: commit_stack
      commit_stack:
        select:
          output: commit_stack
      target:
        kind: stable_branch
steps:
  - id: prepare_bundle
    kind: command
    run: 'bundle_dir=${SCHERZO_WORKFLOW_BUNDLE_DIR:-}; if [ -z "$bundle_dir" ]; then bundle_dir="$(cd "$SCHERZO_CONFIG_DIR/workflows" && pwd -P)"; fi; repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; "$bundle_dir/scripts/scherzo-execplan" implementation-prepare --prefer-workstream-input'
    timeout: 5m
    run_in: main

  - id: refresh_base_before_implementation
    kind: command
    depends_on: [prepare_bundle]
    run: 'bundle_dir=${SCHERZO_WORKFLOW_BUNDLE_DIR:-}; if [ -z "$bundle_dir" ]; then bundle_dir="$(cd "$SCHERZO_CONFIG_DIR/workflows" && pwd -P)"; fi; repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; "$bundle_dir/scripts/scherzo-implementation" refresh-base --stage before-implementation'
    timeout: 5m
    run_in: main

  - id: implement_plan
    kind: agent
    depends_on: [refresh_base_before_implementation]
    prompt: prompts/execplan-implementation-implement.md
    model: openai-codex/gpt-5.4
    thinking: medium
    run_in: main

  - id: gate_no_conflict
    kind: command
    depends_on: [implement_plan]
    run: 'bundle_dir=${SCHERZO_WORKFLOW_BUNDLE_DIR:-}; if [ -z "$bundle_dir" ]; then bundle_dir="$(cd "$SCHERZO_CONFIG_DIR/workflows" && pwd -P)"; fi; repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; "$bundle_dir/scripts/scherzo-execplan" gate-no-conflict'
    run_in: main

  - id: analyze_changes
    kind: command
    depends_on: [gate_no_conflict]
    run: 'bundle_dir=${SCHERZO_WORKFLOW_BUNDLE_DIR:-}; if [ -z "$bundle_dir" ]; then bundle_dir="$(cd "$SCHERZO_CONFIG_DIR/workflows" && pwd -P)"; fi; repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; "$bundle_dir/scripts/scherzo-implementation" analyze'
    run_in: main

  - id: restore_execplan_artifacts_before_plan_completion
    kind: command
    depends_on: [analyze_changes]
    run: 'bundle_dir=${SCHERZO_WORKFLOW_BUNDLE_DIR:-}; if [ -z "$bundle_dir" ]; then bundle_dir="$(cd "$SCHERZO_CONFIG_DIR/workflows" && pwd -P)"; fi; repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; "$bundle_dir/scripts/scherzo-implementation" restore-execplan-artifacts'
    run_in: main

  - id: verify_plan_completion
    kind: agent
    depends_on: [restore_execplan_artifacts_before_plan_completion]
    prompt: prompts/execplan-implementation-verify-completion.md
    run_in: main

  - id: apply_plan_completion_feedback
    kind: agent
    depends_on: [verify_plan_completion]
    prompt: prompts/execplan-implementation-apply-plan-completion-feedback.md
    model: openai-codex/gpt-5.4
    thinking: medium
    run_in: main

  - id: analyze_changes_after_plan_feedback
    kind: command
    depends_on: [apply_plan_completion_feedback]
    run: 'bundle_dir=${SCHERZO_WORKFLOW_BUNDLE_DIR:-}; if [ -z "$bundle_dir" ]; then bundle_dir="$(cd "$SCHERZO_CONFIG_DIR/workflows" && pwd -P)"; fi; repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; "$bundle_dir/scripts/scherzo-implementation" analyze'
    run_in: main

  - id: restore_execplan_artifacts_after_plan_feedback
    kind: command
    depends_on: [analyze_changes_after_plan_feedback]
    run: 'bundle_dir=${SCHERZO_WORKFLOW_BUNDLE_DIR:-}; if [ -z "$bundle_dir" ]; then bundle_dir="$(cd "$SCHERZO_CONFIG_DIR/workflows" && pwd -P)"; fi; repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; "$bundle_dir/scripts/scherzo-implementation" restore-execplan-artifacts'
    run_in: main

  - id: verify_plan_completion_after_feedback
    kind: agent
    depends_on: [restore_execplan_artifacts_after_plan_feedback]
    prompt: prompts/execplan-implementation-verify-completion-after-feedback.md
    run_in: main

  - id: gate_plan_completion
    kind: command
    depends_on: [verify_plan_completion_after_feedback]
    run: 'bundle_dir=${SCHERZO_WORKFLOW_BUNDLE_DIR:-}; if [ -z "$bundle_dir" ]; then bundle_dir="$(cd "$SCHERZO_CONFIG_DIR/workflows" && pwd -P)"; fi; repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; "$bundle_dir/scripts/scherzo-implementation" gate-plan-completion'
    on_failure: continue
    run_in: main

  - id: classify_plan_completion_gate
    kind: command
    depends_on: [gate_plan_completion]
    run: 'bundle_dir=${SCHERZO_WORKFLOW_BUNDLE_DIR:-}; if [ -z "$bundle_dir" ]; then bundle_dir="$(cd "$SCHERZO_CONFIG_DIR/workflows" && pwd -P)"; fi; repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; "$bundle_dir/scripts/scherzo-implementation" plan-completion-recovery --phase before-late-repair --attempt 2 --max-attempts 3'
    run_in: main

  - id: apply_late_plan_completion_feedback
    kind: agent
    depends_on: [classify_plan_completion_gate]
    prompt: prompts/execplan-implementation-apply-late-plan-completion-feedback.md
    model: openai-codex/gpt-5.4
    thinking: medium
    run_in: main

  - id: analyze_changes_after_late_plan_feedback
    kind: command
    depends_on: [apply_late_plan_completion_feedback]
    run: 'bundle_dir=${SCHERZO_WORKFLOW_BUNDLE_DIR:-}; if [ -z "$bundle_dir" ]; then bundle_dir="$(cd "$SCHERZO_CONFIG_DIR/workflows" && pwd -P)"; fi; repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; "$bundle_dir/scripts/scherzo-implementation" analyze'
    run_in: main

  - id: restore_execplan_artifacts_after_late_plan_feedback
    kind: command
    depends_on: [analyze_changes_after_late_plan_feedback]
    run: 'bundle_dir=${SCHERZO_WORKFLOW_BUNDLE_DIR:-}; if [ -z "$bundle_dir" ]; then bundle_dir="$(cd "$SCHERZO_CONFIG_DIR/workflows" && pwd -P)"; fi; repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; "$bundle_dir/scripts/scherzo-implementation" restore-execplan-artifacts'
    run_in: main

  - id: verify_plan_completion_after_late_repair
    kind: agent
    depends_on: [restore_execplan_artifacts_after_late_plan_feedback]
    prompt: prompts/execplan-implementation-verify-completion-after-late-repair.md
    run_in: main

  - id: gate_plan_completion_after_late_repair
    kind: command
    depends_on: [verify_plan_completion_after_late_repair]
    run: 'bundle_dir=${SCHERZO_WORKFLOW_BUNDLE_DIR:-}; if [ -z "$bundle_dir" ]; then bundle_dir="$(cd "$SCHERZO_CONFIG_DIR/workflows" && pwd -P)"; fi; repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; "$bundle_dir/scripts/scherzo-implementation" gate-plan-completion'
    on_failure: continue
    run_in: main

  - id: classify_plan_completion_gate_after_late_repair
    kind: command
    depends_on: [gate_plan_completion_after_late_repair]
    run: 'bundle_dir=${SCHERZO_WORKFLOW_BUNDLE_DIR:-}; if [ -z "$bundle_dir" ]; then bundle_dir="$(cd "$SCHERZO_CONFIG_DIR/workflows" && pwd -P)"; fi; repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; "$bundle_dir/scripts/scherzo-implementation" plan-completion-recovery --phase before-final-repair --attempt 3 --max-attempts 3'
    run_in: main

  - id: apply_final_plan_completion_feedback
    kind: agent
    depends_on: [classify_plan_completion_gate_after_late_repair]
    prompt: prompts/execplan-implementation-apply-final-plan-completion-feedback.md
    model: openai-codex/gpt-5.4
    thinking: medium
    run_in: main

  - id: analyze_changes_after_final_plan_feedback
    kind: command
    depends_on: [apply_final_plan_completion_feedback]
    run: 'bundle_dir=${SCHERZO_WORKFLOW_BUNDLE_DIR:-}; if [ -z "$bundle_dir" ]; then bundle_dir="$(cd "$SCHERZO_CONFIG_DIR/workflows" && pwd -P)"; fi; repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; "$bundle_dir/scripts/scherzo-implementation" analyze'
    run_in: main

  - id: restore_execplan_artifacts_after_final_plan_feedback
    kind: command
    depends_on: [analyze_changes_after_final_plan_feedback]
    run: 'bundle_dir=${SCHERZO_WORKFLOW_BUNDLE_DIR:-}; if [ -z "$bundle_dir" ]; then bundle_dir="$(cd "$SCHERZO_CONFIG_DIR/workflows" && pwd -P)"; fi; repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; "$bundle_dir/scripts/scherzo-implementation" restore-execplan-artifacts'
    run_in: main

  - id: verify_plan_completion_after_final_repair
    kind: agent
    depends_on: [restore_execplan_artifacts_after_final_plan_feedback]
    prompt: prompts/execplan-implementation-verify-completion-after-final-repair.md
    run_in: main

  - id: gate_plan_completion_after_final_repair
    kind: command
    depends_on: [verify_plan_completion_after_final_repair]
    run: 'bundle_dir=${SCHERZO_WORKFLOW_BUNDLE_DIR:-}; if [ -z "$bundle_dir" ]; then bundle_dir="$(cd "$SCHERZO_CONFIG_DIR/workflows" && pwd -P)"; fi; repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; "$bundle_dir/scripts/scherzo-implementation" gate-plan-completion'
    on_failure: continue
    run_in: main

  - id: finalize_plan_completion_gate_recovery
    kind: command
    depends_on: [gate_plan_completion_after_final_repair]
    run: 'bundle_dir=${SCHERZO_WORKFLOW_BUNDLE_DIR:-}; if [ -z "$bundle_dir" ]; then bundle_dir="$(cd "$SCHERZO_CONFIG_DIR/workflows" && pwd -P)"; fi; repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; "$bundle_dir/scripts/scherzo-implementation" plan-completion-recovery --phase after-final-repair --attempt 3 --max-attempts 3'
    run_in: main
    recovery:
      enabled: false

  - id: validate_before_native_review
    kind: command
    depends_on: [finalize_plan_completion_gate_recovery]
    run: 'bundle_dir=${SCHERZO_WORKFLOW_BUNDLE_DIR:-}; if [ -z "$bundle_dir" ]; then bundle_dir="$(cd "$SCHERZO_CONFIG_DIR/workflows" && pwd -P)"; fi; repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; "$bundle_dir/scripts/scherzo-implementation" validate'
    timeout: 20m
    on_failure: continue
    run_in: main

  - id: assert_native_review_cutover
    kind: command
    depends_on: [validate_before_native_review]
    run: 'output_dir="$SCHERZO_RUN_ROOT/artifacts/review/cutover_contract"; mkdir -p "$output_dir"; forbidden=""; if [ -n "${SCHERZO_NATIVE_REVIEW_SCENARIO:-}" ]; then forbidden="$forbidden SCHERZO_NATIVE_REVIEW_SCENARIO"; fi; if [ -n "${SCHERZO_STAGED_REVIEW_AGENT_BACKEND:-}" ]; then forbidden="$forbidden SCHERZO_STAGED_REVIEW_AGENT_BACKEND"; fi; if [ -n "${SCHERZO_REVIEW_AGENT_BACKEND:-}" ]; then forbidden="$forbidden SCHERZO_REVIEW_AGENT_BACKEND"; fi; if [ -n "$forbidden" ]; then printf "native implementation review cutover refuses fixture/scenario/heuristic override environment variables:%s\n" "$forbidden" | tee "$output_dir/cutover-contract.txt"; exit 1; fi; printf "native_review_cutover=enabled\nsemantic_review=kind_agent\nstructured_output_source=pi_tool_call/submit_review_lane_draft\nlegacy_backend_env=refused\nnative_review_scenario=refused\nremote_mutations=none\n" > "$output_dir/cutover-contract.txt"; cat "$output_dir/cutover-contract.txt"'
    run_in: main

  - id: prepare_review
    kind: command
    depends_on: [assert_native_review_cutover]
    run: 'bundle_dir=${SCHERZO_WORKFLOW_BUNDLE_DIR:-}; if [ -z "$bundle_dir" ]; then bundle_dir="$(cd "$SCHERZO_CONFIG_DIR/workflows" && pwd -P)"; fi; repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; output_dir="$SCHERZO_RUN_ROOT/artifacts/review/prepare_review"; if [ -f "$SCHERZO_RUN_ROOT/input.diff" ]; then "$bundle_dir/scripts/scherzo-review" prepare-native --diff-file "$SCHERZO_RUN_ROOT/input.diff" --output-dir "$output_dir" --source-label "execplan-implementation-native" --validation-result tmp/scherzo-implementation-validation.json --validation-log-ref .scherzo/command-step-diagnostics/validate_before_native_review.txt; else "$bundle_dir/scripts/scherzo-review" prepare-native --from "${SCHERZO_REVIEW_FROM:-@-}" --to "${SCHERZO_REVIEW_TO:-@}" --output-dir "$output_dir" --source-label "execplan-implementation-native" --validation-result tmp/scherzo-implementation-validation.json --validation-log-ref .scherzo/command-step-diagnostics/validate_before_native_review.txt; fi'
    timeout: 5m
    run_in: main

  - id: assert_clean_before_lanes
    kind: command
    depends_on: [prepare_review]
    run: 'mkdir -p "$SCHERZO_RUN_ROOT/artifacts/review/dirty_tree"; jj log -r @ --no-graph -T commit_id --color=never > "$SCHERZO_RUN_ROOT/artifacts/review/dirty_tree/before-lanes.txt"; jj status --color=never > "$SCHERZO_RUN_ROOT/artifacts/review/dirty_tree/before-lanes-status.txt"'
    run_in: main

  - id: lane_correctness
    kind: agent
    depends_on: [assert_clean_before_lanes]
    prompt: prompts/review-native-correctness.md
    on_failure: continue
    run_in:
      name: review-correctness
      from: main
    structured_output:
      format: json
      artifact_name: correctness_submission
      source:
        type: pi_tool_call
        tool_name: submit_review_lane_draft
        parameters_schema_path: .scherzo/workflows/schemas/provider/review-lane-draft.correctness.v1.schema.json
      required: true
      validators:
        - name: review_lane_submission_shape
          type: json_schema
          path: .scherzo/workflows/schemas/provider/review-lane-draft.correctness.v1.schema.json
          draft: "2020-12"
      schema:
        type: object
        required:
          - draft_findings
          - review_notes
          - evidence_requests
          - self_check

  - id: lane_test_quality
    kind: agent
    depends_on: [assert_clean_before_lanes]
    prompt: prompts/review-native-test-quality.md
    model: openai-codex/gpt-5.4
    thinking: medium
    on_failure: continue
    run_in:
      name: review-test-quality
      from: main
    structured_output:
      format: json
      artifact_name: test_quality_submission
      source:
        type: pi_tool_call
        tool_name: submit_review_lane_draft
        parameters_schema_path: .scherzo/workflows/schemas/provider/review-lane-draft.test-quality.v1.schema.json
      required: true
      validators:
        - name: review_lane_submission_shape
          type: json_schema
          path: .scherzo/workflows/schemas/provider/review-lane-draft.test-quality.v1.schema.json
          draft: "2020-12"
      schema:
        type: object
        required:
          - draft_findings
          - review_notes
          - evidence_requests
          - self_check

  - id: lane_idioms_maintainability
    kind: agent
    depends_on: [assert_clean_before_lanes]
    prompt: prompts/review-native-idioms-maintainability.md
    model: openai-codex/gpt-5.4
    thinking: medium
    on_failure: continue
    run_in:
      name: review-idioms-maintainability
      from: main
    structured_output:
      format: json
      artifact_name: idioms_maintainability_submission
      source:
        type: pi_tool_call
        tool_name: submit_review_lane_draft
        parameters_schema_path: .scherzo/workflows/schemas/provider/review-lane-draft.idioms-maintainability.v1.schema.json
      required: true
      validators:
        - name: review_lane_submission_shape
          type: json_schema
          path: .scherzo/workflows/schemas/provider/review-lane-draft.idioms-maintainability.v1.schema.json
          draft: "2020-12"
      schema:
        type: object
        required:
          - draft_findings
          - review_notes
          - evidence_requests
          - self_check

  - id: lane_security_performance
    kind: agent
    depends_on: [assert_clean_before_lanes]
    prompt: prompts/review-native-security-performance.md
    on_failure: continue
    run_in:
      name: review-security-performance
      from: main
    structured_output:
      format: json
      artifact_name: security_performance_submission
      source:
        type: pi_tool_call
        tool_name: submit_review_lane_draft
        parameters_schema_path: .scherzo/workflows/schemas/provider/review-lane-draft.security-performance.v1.schema.json
      required: true
      validators:
        - name: review_lane_submission_shape
          type: json_schema
          path: .scherzo/workflows/schemas/provider/review-lane-draft.security-performance.v1.schema.json
          draft: "2020-12"
      schema:
        type: object
        required:
          - draft_findings
          - review_notes
          - evidence_requests
          - self_check

  - id: assert_clean_after_lanes
    kind: command
    depends_on: [lane_correctness, lane_test_quality, lane_idioms_maintainability, lane_security_performance]
    run: 'mkdir -p "$SCHERZO_RUN_ROOT/artifacts/review/dirty_tree"; jj log -r @ --no-graph -T commit_id --color=never > "$SCHERZO_RUN_ROOT/artifacts/review/dirty_tree/after-lanes.txt"; jj status --color=never > "$SCHERZO_RUN_ROOT/artifacts/review/dirty_tree/after-lanes-status.txt"; cmp -s "$SCHERZO_RUN_ROOT/artifacts/review/dirty_tree/before-lanes.txt" "$SCHERZO_RUN_ROOT/artifacts/review/dirty_tree/after-lanes.txt" || { printf "native review lane mutated the main workspace; commit ids differ; see %s, %s, %s, and %s\n" "$SCHERZO_RUN_ROOT/artifacts/review/dirty_tree/before-lanes.txt" "$SCHERZO_RUN_ROOT/artifacts/review/dirty_tree/after-lanes.txt" "$SCHERZO_RUN_ROOT/artifacts/review/dirty_tree/before-lanes-status.txt" "$SCHERZO_RUN_ROOT/artifacts/review/dirty_tree/after-lanes-status.txt" >&2; exit 1; }'
    run_in: main

  - id: materialize_correctness
    kind: command
    depends_on: [assert_clean_after_lanes]
    run: 'bundle_dir=${SCHERZO_WORKFLOW_BUNDLE_DIR:-}; if [ -z "$bundle_dir" ]; then bundle_dir="$(cd "$SCHERZO_CONFIG_DIR/workflows" && pwd -P)"; fi; repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; lane_dir="$SCHERZO_RUN_ROOT/artifacts/review/lanes/correctness"; mkdir -p "$lane_dir"; artifact_dir="${SCHERZO_RUN_ARTIFACT_DIR:-$SCHERZO_RUN_ROOT/.scherzo-state/artifacts/runs/$SCHERZO_RUN_ID}"; if [ ! -e "$artifact_dir" ]; then artifact_dir="$(cd "$SCHERZO_RUN_ROOT/../../.." && pwd -P)/.scherzo-state/artifacts/runs/$SCHERZO_RUN_ID"; fi; "$bundle_dir/scripts/scherzo-review-lane-contract" materialize --lane correctness --artifact-dir "$artifact_dir" --prepare-dir "$SCHERZO_RUN_ROOT/artifacts/review/prepare_review" --output "$lane_dir/review-lane-draft.v1.json"'
    on_failure: continue
    run_in: main

  - id: materialize_test_quality
    kind: command
    depends_on: [assert_clean_after_lanes]
    run: 'bundle_dir=${SCHERZO_WORKFLOW_BUNDLE_DIR:-}; if [ -z "$bundle_dir" ]; then bundle_dir="$(cd "$SCHERZO_CONFIG_DIR/workflows" && pwd -P)"; fi; repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; lane_dir="$SCHERZO_RUN_ROOT/artifacts/review/lanes/test-quality"; mkdir -p "$lane_dir"; artifact_dir="${SCHERZO_RUN_ARTIFACT_DIR:-$SCHERZO_RUN_ROOT/.scherzo-state/artifacts/runs/$SCHERZO_RUN_ID}"; if [ ! -e "$artifact_dir" ]; then artifact_dir="$(cd "$SCHERZO_RUN_ROOT/../../.." && pwd -P)/.scherzo-state/artifacts/runs/$SCHERZO_RUN_ID"; fi; "$bundle_dir/scripts/scherzo-review-lane-contract" materialize --lane test-quality --artifact-dir "$artifact_dir" --prepare-dir "$SCHERZO_RUN_ROOT/artifacts/review/prepare_review" --output "$lane_dir/review-lane-draft.v1.json"'
    on_failure: continue
    run_in: main

  - id: materialize_idioms_maintainability
    kind: command
    depends_on: [assert_clean_after_lanes]
    run: 'bundle_dir=${SCHERZO_WORKFLOW_BUNDLE_DIR:-}; if [ -z "$bundle_dir" ]; then bundle_dir="$(cd "$SCHERZO_CONFIG_DIR/workflows" && pwd -P)"; fi; repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; lane_dir="$SCHERZO_RUN_ROOT/artifacts/review/lanes/idioms-maintainability"; mkdir -p "$lane_dir"; artifact_dir="${SCHERZO_RUN_ARTIFACT_DIR:-$SCHERZO_RUN_ROOT/.scherzo-state/artifacts/runs/$SCHERZO_RUN_ID}"; if [ ! -e "$artifact_dir" ]; then artifact_dir="$(cd "$SCHERZO_RUN_ROOT/../../.." && pwd -P)/.scherzo-state/artifacts/runs/$SCHERZO_RUN_ID"; fi; "$bundle_dir/scripts/scherzo-review-lane-contract" materialize --lane idioms-maintainability --artifact-dir "$artifact_dir" --prepare-dir "$SCHERZO_RUN_ROOT/artifacts/review/prepare_review" --output "$lane_dir/review-lane-draft.v1.json"'
    on_failure: continue
    run_in: main

  - id: materialize_security_performance
    kind: command
    depends_on: [assert_clean_after_lanes]
