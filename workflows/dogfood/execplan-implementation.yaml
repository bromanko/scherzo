    run: 'bundle_dir=${SCHERZO_WORKFLOW_BUNDLE_DIR:-}; if [ -z "$bundle_dir" ]; then bundle_dir="$(cd "$SCHERZO_CONFIG_DIR/workflows" && pwd -P)"; fi; repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; lane_dir="$SCHERZO_RUN_ROOT/artifacts/review/lanes/test-quality"; artifact_dir="${SCHERZO_RUN_ARTIFACT_DIR:-$SCHERZO_RUN_ROOT/.scherzo-state/artifacts/runs/$SCHERZO_RUN_ID}"; if [ ! -e "$artifact_dir" ]; then artifact_dir="$(cd "$SCHERZO_RUN_ROOT/../../.." && pwd -P)/.scherzo-state/artifacts/runs/$SCHERZO_RUN_ID"; fi; draft_path="$lane_dir/review-lane-draft.v1.json"; "$bundle_dir/scripts/scherzo-review" normalize-lane-result --lane test-quality --draft "$draft_path" --evidence-ledger "$lane_dir/evidence-ledger.v1.json" --agent-artifact-dir "$artifact_dir" --brief "$SCHERZO_RUN_ROOT/artifacts/review/prepare_review/review-brief.v1.json" --output-dir "$lane_dir"'
