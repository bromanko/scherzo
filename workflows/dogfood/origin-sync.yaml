# yaml-language-server: $schema=../../schemas/scherzo.workflow.v1.schema.json
version: 1
id: origin-sync
description: Fetch the configured root remote, advance local main to the configured base when safe, and auto-rebase the empty root jj stack.
workspace:
  driver: origin-sync
concurrency: 1
steps:
  - id: sync_origin
    kind: command
    run: ': "${SCHERZO_WORKFLOW_BUNDLE_DIR:?Scherzo command-step contract missing SCHERZO_WORKFLOW_BUNDLE_DIR}"; "$SCHERZO_WORKFLOW_BUNDLE_DIR/scripts/scherzo-jj-origin-sync"'
    timeout: 5m
    run_in: main
