# yaml-language-server: $schema=../../schemas/scherzo.workflow.v1.schema.json
version: 1
id: execplan
description: Draft a concise ExecPlan review doc, retain the mechanical implementation pack, and emit an exec_plan_bundle.
workspace:
  driver: dogfood-jj
  requires: [status, diff, changed-files, publish-commit-stack]
concurrency: 1
recovery:
  attempts: 1
  prompt: prompts/execplan-recover-failed-step.md
contract:
  version: 1
  inputs:
    brief:
      kind: file
      media_type: text/plain
      required: true
      source: issue_context
    supporting_context:
      kind: artifact_set
      artifact_type: artifact[]
      required: false
      source: mapped_output
  outputs:
    plan:
      kind: file
      media_type: text/markdown
      artifact_type: scherzo.exec_plan.v1
      source:
        step: materialize_bundle
        path: tmp/execplan-review-doc.md
    implementation_pack:
      kind: file
      media_type: application/json
      artifact_type: scherzo.implementation_pack.v2
      source:
        step: materialize_pack
        path: tmp/execplan-implementation-pack.json
    exec_plan_bundle:
      kind: artifact_set
      media_type: application/json
      artifact_type: scherzo.exec_plan_bundle.v2
      source:
        step: materialize_bundle
        path: tmp/execplan-bundle.json
    commit_stack:
      kind: commit_stack
      media_type: application/vnd.scherzo.git-commit-stack+json
      artifact_type: scherzo.git_commit_stack.v1
      source:
        step: materialize_commit_stack
        path: tmp/execplan-commit-stack.json
artifacts:
  publications:
    - id: execplan_review_doc
      repository: github.code
      required: true
      mode: commit_stack
      pull_request:
        title: "{{ work.identifier }}: publish ExecPlan review doc"
        body_template: prompts/execplan-pr-body.md
      commit_stack:
        select:
          output: commit_stack
      target:
        kind: stable_branch
workstream_phase:
  phase_id: execplan
  display_name: ExecPlan authored
  handoff:
    output: exec_plan_bundle
    artifact_type: scherzo.handoff.v1
    snapshot: required
  next_actions:
    - action_id: implement_exec_plan
      workflow_id: execplan-implementation
      state: suggested
      priority: 0
      inputs: [exec_plan_bundle]
      requires_gate: human_review
      auto_enqueue: false
    - action_id: revise_exec_plan
      workflow_id: execplan-revision
      state: suggested
      priority: 1
      inputs: [exec_plan_bundle]
      auto_enqueue: false
steps:
  - id: prepare_review_doc_target
    kind: command
    run: 'bundle_dir=${SCHERZO_WORKFLOW_BUNDLE_DIR:-}; if [ -z "$bundle_dir" ]; then bundle_dir="$(cd "$SCHERZO_CONFIG_DIR/workflows" && pwd -P)"; fi; repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; "$bundle_dir/scripts/scherzo-execplan" prepare-review-doc-target --from-issue-context --write-target tmp/execplan-review-doc-target.json'
    run_in: main

  - id: draft_review_doc_and_pack
    kind: agent
    depends_on: [prepare_review_doc_target]
    prompt: prompts/execplan-draft.md
    run_in: main
    structured_output:
      format: json
      artifact_name: implementation_pack_submission
      source:
        type: pi_tool_call
        tool_name: submit_implementation_pack_submission
        parameters_schema_path: .scherzo/workflows/schemas/provider/implementation-pack-submission.v2.schema.json
        require_single: true
        reject_sibling_tool_calls: true
      required: true
      validators:
        - name: implementation_pack_submission_provider_shape
          type: json_schema
          path: .scherzo/workflows/schemas/provider/implementation-pack-submission.v2.schema.json
          draft: "2020-12"
        - name: implementation_pack_submission_shape
          type: json_schema
          path: .scherzo/workflows/schemas/implementation-pack-submission.v2.schema.json
          draft: "2020-12"

  - id: validate_review_doc
    kind: command
    depends_on: [draft_review_doc_and_pack]
    run: 'bundle_dir=${SCHERZO_WORKFLOW_BUNDLE_DIR:-}; if [ -z "$bundle_dir" ]; then bundle_dir="$(cd "$SCHERZO_CONFIG_DIR/workflows" && pwd -P)"; fi; repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; "$bundle_dir/scripts/scherzo-execplan" validate-review-doc --discover-changed-review-doc --target-file tmp/execplan-review-doc-target.json --write-path tmp/execplan-review-doc.path'
    run_in: main

  - id: review_plan
    kind: agent
    depends_on: [validate_review_doc]
    prompt: prompts/execplan-review.md
    run_in: main

  - id: incorporate_review
    kind: agent
    depends_on: [review_plan]
    prompt: prompts/execplan-incorporate-review.md
    run_in: main
    structured_output:
      format: json
      artifact_name: implementation_pack_submission
      source:
        type: pi_tool_call
        tool_name: submit_implementation_pack_submission
        parameters_schema_path: .scherzo/workflows/schemas/provider/implementation-pack-submission.v2.schema.json
        require_single: true
        reject_sibling_tool_calls: true
      required: true
      validators:
        - name: implementation_pack_submission_provider_shape
          type: json_schema
          path: .scherzo/workflows/schemas/provider/implementation-pack-submission.v2.schema.json
          draft: "2020-12"
        - name: implementation_pack_submission_shape
          type: json_schema
          path: .scherzo/workflows/schemas/implementation-pack-submission.v2.schema.json
          draft: "2020-12"

  - id: validate_review_doc_after_review
    kind: command
    depends_on: [incorporate_review]
    run: 'bundle_dir=${SCHERZO_WORKFLOW_BUNDLE_DIR:-}; if [ -z "$bundle_dir" ]; then bundle_dir="$(cd "$SCHERZO_CONFIG_DIR/workflows" && pwd -P)"; fi; repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; review_doc_path=$(cat tmp/execplan-review-doc.path); "$bundle_dir/scripts/scherzo-execplan" validate-review-doc --path "$review_doc_path"'
    run_in: main

  - id: materialize_pack
    kind: command
    depends_on: [validate_review_doc_after_review]
    run: 'bundle_dir=${SCHERZO_WORKFLOW_BUNDLE_DIR:-}; if [ -z "$bundle_dir" ]; then bundle_dir="$(cd "$SCHERZO_CONFIG_DIR/workflows" && pwd -P)"; fi; repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; artifact_dir="${SCHERZO_RUN_ARTIFACT_DIR:-$SCHERZO_RUN_ROOT/.scherzo-state/artifacts/runs/$SCHERZO_RUN_ID}"; if [ ! -e "$artifact_dir" ]; then artifact_dir="$(cd "$SCHERZO_RUN_ROOT/../../.." && pwd -P)/.scherzo-state/artifacts/runs/$SCHERZO_RUN_ID"; fi; SCHERZO_RUN_ARTIFACT_DIR="$artifact_dir" "$bundle_dir/scripts/scherzo-execplan" materialize-pack --review-doc-path-file tmp/execplan-review-doc.path --submission-step incorporate_review --submission-artifact implementation_pack_submission --output tmp/execplan-implementation-pack.json'
    run_in: main

  - id: materialize_commit_stack
    kind: command
    depends_on: [materialize_pack]
    run: 'bundle_dir=${SCHERZO_WORKFLOW_BUNDLE_DIR:-}; if [ -z "$bundle_dir" ]; then bundle_dir="$(cd "$SCHERZO_CONFIG_DIR/workflows" && pwd -P)"; fi; repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; artifact_dir="${SCHERZO_RUN_ARTIFACT_DIR:-$SCHERZO_RUN_ROOT/.scherzo-state/artifacts/runs/$SCHERZO_RUN_ID}"; if [ ! -e "$artifact_dir" ]; then artifact_dir="$(cd "$SCHERZO_RUN_ROOT/../../.." && pwd -P)/.scherzo-state/artifacts/runs/$SCHERZO_RUN_ID"; fi; SCHERZO_RUN_ARTIFACT_DIR="$artifact_dir" "$bundle_dir/scripts/scherzo-execplan" materialize-commit-stack --review-doc-path-file tmp/execplan-review-doc.path --output tmp/execplan-commit-stack.json'
    timeout: 5m
    run_in: main

  - id: materialize_bundle
    kind: command
    depends_on: [materialize_commit_stack]
    run: 'bundle_dir=${SCHERZO_WORKFLOW_BUNDLE_DIR:-}; if [ -z "$bundle_dir" ]; then bundle_dir="$(cd "$SCHERZO_CONFIG_DIR/workflows" && pwd -P)"; fi; repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; "$bundle_dir/scripts/scherzo-execplan" materialize-bundle --review-doc-path-file tmp/execplan-review-doc.path --pack tmp/execplan-implementation-pack.json --output tmp/execplan-bundle.json'
    timeout: 5m
    run_in: main
    recovery:
      enabled: false
