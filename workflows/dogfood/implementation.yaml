version: 1
id: implementation
description: Implement a focused Scherzo task from Linear-fetched context, review it, validate it, publish a PR, and report the PR URL.
workspace:
  driver: dogfood-jj
  requires: [status, diff, changed-files, baseline, refresh-base, publish-change]
concurrency: 4
recovery:
  attempts: 1
  prompt: prompts/implementation-recover-failed-step.md
steps:
  - id: prepare_context
    kind: command
    run: 'bundle_dir=${SCHERZO_WORKFLOW_BUNDLE_DIR:-}; if [ -z "$bundle_dir" ]; then bundle_dir="$(cd "$SCHERZO_CONFIG_DIR/workflows" && pwd -P)"; fi; repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; "$bundle_dir/scripts/scherzo-implementation" prepare --source ticket'
    timeout: 5m
    run_in: main

  - id: refresh_base_before_implementation
    kind: command
    depends_on: [prepare_context]
    run: 'bundle_dir=${SCHERZO_WORKFLOW_BUNDLE_DIR:-}; if [ -z "$bundle_dir" ]; then bundle_dir="$(cd "$SCHERZO_CONFIG_DIR/workflows" && pwd -P)"; fi; repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; "$bundle_dir/scripts/scherzo-implementation" refresh-base --stage before-implementation'
    timeout: 5m
    run_in: main

  - id: implement
    kind: agent
    depends_on: [refresh_base_before_implementation]
    prompt: prompts/implement.md
    run_in: main

  - id: analyze_changes
    kind: command
    depends_on: [implement]
    run: 'bundle_dir=${SCHERZO_WORKFLOW_BUNDLE_DIR:-}; if [ -z "$bundle_dir" ]; then bundle_dir="$(cd "$SCHERZO_CONFIG_DIR/workflows" && pwd -P)"; fi; repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; "$bundle_dir/scripts/scherzo-implementation" analyze'
    run_in: main

  - id: validate_before_native_review
    kind: command
    depends_on: [analyze_changes]
    run: 'bundle_dir=${SCHERZO_WORKFLOW_BUNDLE_DIR:-}; if [ -z "$bundle_dir" ]; then bundle_dir="$(cd "$SCHERZO_CONFIG_DIR/workflows" && pwd -P)"; fi; repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; "$bundle_dir/scripts/scherzo-implementation" validate'
    timeout: 20m
    on_failure: continue
    run_in: main

  - id: assert_native_review_cutover
    kind: command
    depends_on: [validate_before_native_review]
    run: 'output_dir="$SCHERZO_RUN_ROOT/artifacts/review/cutover_contract"; mkdir -p "$output_dir"; forbidden=""; if [ -n "${SCHERZO_NATIVE_REVIEW_SCENARIO:-}" ]; then forbidden="$forbidden SCHERZO_NATIVE_REVIEW_SCENARIO"; fi; if [ -n "${SCHERZO_STAGED_REVIEW_AGENT_BACKEND:-}" ]; then forbidden="$forbidden SCHERZO_STAGED_REVIEW_AGENT_BACKEND"; fi; if [ -n "${SCHERZO_REVIEW_AGENT_BACKEND:-}" ]; then forbidden="$forbidden SCHERZO_REVIEW_AGENT_BACKEND"; fi; if [ -n "$forbidden" ]; then printf "native implementation review cutover refuses fixture/scenario/heuristic override environment variables:%s\n" "$forbidden" | tee "$output_dir/cutover-contract.txt"; exit 1; fi; printf "native_review_cutover=enabled\nsemantic_review=kind_agent\nstructured_output_source=pi_tool_call/submit_review_lane_draft\nlegacy_backend_env=refused\nnative_review_scenario=refused\nremote_mutations=none\n" > "$output_dir/cutover-contract.txt"; cat "$output_dir/cutover-contract.txt"'
    run_in: main

  - id: prepare_review
    kind: command
    depends_on: [assert_native_review_cutover]
    run: 'bundle_dir=${SCHERZO_WORKFLOW_BUNDLE_DIR:-}; if [ -z "$bundle_dir" ]; then bundle_dir="$(cd "$SCHERZO_CONFIG_DIR/workflows" && pwd -P)"; fi; repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; output_dir="$SCHERZO_RUN_ROOT/artifacts/review/prepare_review"; if [ -f "$SCHERZO_RUN_ROOT/input.diff" ]; then "$bundle_dir/scripts/scherzo-review" prepare-native --diff-file "$SCHERZO_RUN_ROOT/input.diff" --output-dir "$output_dir" --source-label "implementation-native" --validation-result tmp/scherzo-implementation-validation.json --validation-log-ref .scherzo/command-step-diagnostics/validate_before_native_review.txt; else "$bundle_dir/scripts/scherzo-review" prepare-native --from "${SCHERZO_REVIEW_FROM:-@-}" --to "${SCHERZO_REVIEW_TO:-@}" --output-dir "$output_dir" --source-label "implementation-native" --validation-result tmp/scherzo-implementation-validation.json --validation-log-ref .scherzo/command-step-diagnostics/validate_before_native_review.txt; fi'
    timeout: 5m
    run_in: main

  - id: assert_clean_before_lanes
    kind: command
    depends_on: [prepare_review]
    run: 'mkdir -p "$SCHERZO_RUN_ROOT/artifacts/review/dirty_tree"; jj log -r @ --no-graph -T commit_id --color=never > "$SCHERZO_RUN_ROOT/artifacts/review/dirty_tree/before-lanes.txt"; jj status --color=never > "$SCHERZO_RUN_ROOT/artifacts/review/dirty_tree/before-lanes-status.txt"'
    run_in: main

  - id: lane_correctness
    kind: agent
    depends_on: [assert_clean_before_lanes]
    prompt: prompts/review-native-correctness.md
    on_failure: continue
    run_in:
      name: review-correctness
      from: main
    structured_output:
      format: json
      artifact_name: correctness_submission
      source:
        type: pi_tool_call
        tool_name: submit_review_lane_draft
        parameters_schema_path: .scherzo/workflows/schemas/provider/review-lane-draft.correctness.v1.schema.json
        require_single: true
        reject_sibling_tool_calls: true
      required: true
      validators:
        - name: review_lane_submission_shape
          type: json_schema
          path: .scherzo/workflows/schemas/provider/review-lane-draft.correctness.v1.schema.json
          draft: "2020-12"
      schema:
        type: object
        required:
          - draft_findings
          - review_notes
          - evidence_requests
          - self_check

  - id: lane_test_quality
    kind: agent
    depends_on: [assert_clean_before_lanes]
    prompt: prompts/review-native-test-quality.md
    model: openai-codex/gpt-5.4
    thinking: medium
    on_failure: continue
    run_in:
      name: review-test-quality
      from: main
    structured_output:
      format: json
      artifact_name: test_quality_submission
      source:
        type: pi_tool_call
        tool_name: submit_review_lane_draft
        parameters_schema_path: .scherzo/workflows/schemas/provider/review-lane-draft.test-quality.v1.schema.json
        require_single: true
        reject_sibling_tool_calls: true
      required: true
      validators:
        - name: review_lane_submission_shape
          type: json_schema
          path: .scherzo/workflows/schemas/provider/review-lane-draft.test-quality.v1.schema.json
          draft: "2020-12"
      schema:
        type: object
        required:
          - draft_findings
          - review_notes
          - evidence_requests
          - self_check

  - id: lane_idioms_maintainability
    kind: agent
    depends_on: [assert_clean_before_lanes]
    prompt: prompts/review-native-idioms-maintainability.md
    model: openai-codex/gpt-5.4
    thinking: medium
    on_failure: continue
    run_in:
      name: review-idioms-maintainability
      from: main
    structured_output:
      format: json
      artifact_name: idioms_maintainability_submission
      source:
        type: pi_tool_call
        tool_name: submit_review_lane_draft
        parameters_schema_path: .scherzo/workflows/schemas/provider/review-lane-draft.idioms-maintainability.v1.schema.json
        require_single: true
        reject_sibling_tool_calls: true
      required: true
      validators:
        - name: review_lane_submission_shape
          type: json_schema
          path: .scherzo/workflows/schemas/provider/review-lane-draft.idioms-maintainability.v1.schema.json
          draft: "2020-12"
      schema:
        type: object
        required:
          - draft_findings
          - review_notes
          - evidence_requests
          - self_check

  - id: lane_security_performance
    kind: agent
    depends_on: [assert_clean_before_lanes]
    prompt: prompts/review-native-security-performance.md
    on_failure: continue
    run_in:
      name: review-security-performance
      from: main
    structured_output:
      format: json
      artifact_name: security_performance_submission
      source:
        type: pi_tool_call
        tool_name: submit_review_lane_draft
        parameters_schema_path: .scherzo/workflows/schemas/provider/review-lane-draft.security-performance.v1.schema.json
        require_single: true
        reject_sibling_tool_calls: true
      required: true
      validators:
        - name: review_lane_submission_shape
          type: json_schema
          path: .scherzo/workflows/schemas/provider/review-lane-draft.security-performance.v1.schema.json
          draft: "2020-12"
      schema:
        type: object
        required:
          - draft_findings
          - review_notes
          - evidence_requests
          - self_check

  - id: assert_clean_after_lanes
    kind: command
    depends_on: [lane_correctness, lane_test_quality, lane_idioms_maintainability, lane_security_performance]
    run: 'mkdir -p "$SCHERZO_RUN_ROOT/artifacts/review/dirty_tree"; jj log -r @ --no-graph -T commit_id --color=never > "$SCHERZO_RUN_ROOT/artifacts/review/dirty_tree/after-lanes.txt"; jj status --color=never > "$SCHERZO_RUN_ROOT/artifacts/review/dirty_tree/after-lanes-status.txt"; cmp -s "$SCHERZO_RUN_ROOT/artifacts/review/dirty_tree/before-lanes.txt" "$SCHERZO_RUN_ROOT/artifacts/review/dirty_tree/after-lanes.txt" || { printf "native review lane mutated the main workspace; commit ids differ; see %s, %s, %s, and %s\n" "$SCHERZO_RUN_ROOT/artifacts/review/dirty_tree/before-lanes.txt" "$SCHERZO_RUN_ROOT/artifacts/review/dirty_tree/after-lanes.txt" "$SCHERZO_RUN_ROOT/artifacts/review/dirty_tree/before-lanes-status.txt" "$SCHERZO_RUN_ROOT/artifacts/review/dirty_tree/after-lanes-status.txt" >&2; exit 1; }'
    run_in: main

  - id: materialize_correctness
    kind: command
    depends_on: [assert_clean_after_lanes]
    run: 'bundle_dir=${SCHERZO_WORKFLOW_BUNDLE_DIR:-}; if [ -z "$bundle_dir" ]; then bundle_dir="$(cd "$SCHERZO_CONFIG_DIR/workflows" && pwd -P)"; fi; repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; lane_dir="$SCHERZO_RUN_ROOT/artifacts/review/lanes/correctness"; mkdir -p "$lane_dir"; artifact_dir="${SCHERZO_RUN_ARTIFACT_DIR:-$SCHERZO_RUN_ROOT/.scherzo-state/artifacts/runs/$SCHERZO_RUN_ID}"; if [ ! -e "$artifact_dir" ]; then artifact_dir="$(cd "$SCHERZO_RUN_ROOT/../../.." && pwd -P)/.scherzo-state/artifacts/runs/$SCHERZO_RUN_ID"; fi; "$bundle_dir/scripts/scherzo-review-lane-contract" materialize --lane correctness --artifact-dir "$artifact_dir" --prepare-dir "$SCHERZO_RUN_ROOT/artifacts/review/prepare_review" --output "$lane_dir/review-lane-draft.v1.json"'
    on_failure: continue
    run_in: main

  - id: materialize_test_quality
    kind: command
    depends_on: [assert_clean_after_lanes]
    run: 'bundle_dir=${SCHERZO_WORKFLOW_BUNDLE_DIR:-}; if [ -z "$bundle_dir" ]; then bundle_dir="$(cd "$SCHERZO_CONFIG_DIR/workflows" && pwd -P)"; fi; repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; lane_dir="$SCHERZO_RUN_ROOT/artifacts/review/lanes/test-quality"; mkdir -p "$lane_dir"; artifact_dir="${SCHERZO_RUN_ARTIFACT_DIR:-$SCHERZO_RUN_ROOT/.scherzo-state/artifacts/runs/$SCHERZO_RUN_ID}"; if [ ! -e "$artifact_dir" ]; then artifact_dir="$(cd "$SCHERZO_RUN_ROOT/../../.." && pwd -P)/.scherzo-state/artifacts/runs/$SCHERZO_RUN_ID"; fi; "$bundle_dir/scripts/scherzo-review-lane-contract" materialize --lane test-quality --artifact-dir "$artifact_dir" --prepare-dir "$SCHERZO_RUN_ROOT/artifacts/review/prepare_review" --output "$lane_dir/review-lane-draft.v1.json"'
    on_failure: continue
    run_in: main

  - id: materialize_idioms_maintainability
    kind: command
    depends_on: [assert_clean_after_lanes]
    run: 'bundle_dir=${SCHERZO_WORKFLOW_BUNDLE_DIR:-}; if [ -z "$bundle_dir" ]; then bundle_dir="$(cd "$SCHERZO_CONFIG_DIR/workflows" && pwd -P)"; fi; repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; lane_dir="$SCHERZO_RUN_ROOT/artifacts/review/lanes/idioms-maintainability"; mkdir -p "$lane_dir"; artifact_dir="${SCHERZO_RUN_ARTIFACT_DIR:-$SCHERZO_RUN_ROOT/.scherzo-state/artifacts/runs/$SCHERZO_RUN_ID}"; if [ ! -e "$artifact_dir" ]; then artifact_dir="$(cd "$SCHERZO_RUN_ROOT/../../.." && pwd -P)/.scherzo-state/artifacts/runs/$SCHERZO_RUN_ID"; fi; "$bundle_dir/scripts/scherzo-review-lane-contract" materialize --lane idioms-maintainability --artifact-dir "$artifact_dir" --prepare-dir "$SCHERZO_RUN_ROOT/artifacts/review/prepare_review" --output "$lane_dir/review-lane-draft.v1.json"'
    on_failure: continue
    run_in: main

  - id: materialize_security_performance
    kind: command
    depends_on: [assert_clean_after_lanes]
    run: 'bundle_dir=${SCHERZO_WORKFLOW_BUNDLE_DIR:-}; if [ -z "$bundle_dir" ]; then bundle_dir="$(cd "$SCHERZO_CONFIG_DIR/workflows" && pwd -P)"; fi; repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; lane_dir="$SCHERZO_RUN_ROOT/artifacts/review/lanes/security-performance"; mkdir -p "$lane_dir"; artifact_dir="${SCHERZO_RUN_ARTIFACT_DIR:-$SCHERZO_RUN_ROOT/.scherzo-state/artifacts/runs/$SCHERZO_RUN_ID}"; if [ ! -e "$artifact_dir" ]; then artifact_dir="$(cd "$SCHERZO_RUN_ROOT/../../.." && pwd -P)/.scherzo-state/artifacts/runs/$SCHERZO_RUN_ID"; fi; "$bundle_dir/scripts/scherzo-review-lane-contract" materialize --lane security-performance --artifact-dir "$artifact_dir" --prepare-dir "$SCHERZO_RUN_ROOT/artifacts/review/prepare_review" --output "$lane_dir/review-lane-draft.v1.json"'
    on_failure: continue
    run_in: main

  - id: verify_correctness_evidence
    kind: command
    depends_on: [materialize_correctness]
    run: 'bundle_dir=${SCHERZO_WORKFLOW_BUNDLE_DIR:-}; if [ -z "$bundle_dir" ]; then bundle_dir="$(cd "$SCHERZO_CONFIG_DIR/workflows" && pwd -P)"; fi; repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; lane_dir="$SCHERZO_RUN_ROOT/artifacts/review/lanes/correctness"; mkdir -p "$lane_dir"; draft_path="$lane_dir/review-lane-draft.v1.json"; "$bundle_dir/scripts/scherzo-review" verify-evidence --lane correctness --draft "$draft_path" --brief "$SCHERZO_RUN_ROOT/artifacts/review/prepare_review/review-brief.v1.json" --diff-file "$SCHERZO_RUN_ROOT/artifacts/review/prepare_review/diff.patch" --changed-files "$SCHERZO_RUN_ROOT/artifacts/review/prepare_review/changed-files.v1.json" --validation-status "$SCHERZO_RUN_ROOT/artifacts/review/prepare_review/validation-status.v1.json" --context-manifest "$SCHERZO_RUN_ROOT/artifacts/review/prepare_review/context-manifest.v1.json" --output-dir "$lane_dir"'
    on_failure: continue
    run_in: main

  - id: verify_test_quality_evidence
    kind: command
    depends_on: [materialize_test_quality]
    run: 'bundle_dir=${SCHERZO_WORKFLOW_BUNDLE_DIR:-}; if [ -z "$bundle_dir" ]; then bundle_dir="$(cd "$SCHERZO_CONFIG_DIR/workflows" && pwd -P)"; fi; repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; lane_dir="$SCHERZO_RUN_ROOT/artifacts/review/lanes/test-quality"; mkdir -p "$lane_dir"; draft_path="$lane_dir/review-lane-draft.v1.json"; "$bundle_dir/scripts/scherzo-review" verify-evidence --lane test-quality --draft "$draft_path" --brief "$SCHERZO_RUN_ROOT/artifacts/review/prepare_review/review-brief.v1.json" --diff-file "$SCHERZO_RUN_ROOT/artifacts/review/prepare_review/diff.patch" --changed-files "$SCHERZO_RUN_ROOT/artifacts/review/prepare_review/changed-files.v1.json" --validation-status "$SCHERZO_RUN_ROOT/artifacts/review/prepare_review/validation-status.v1.json" --context-manifest "$SCHERZO_RUN_ROOT/artifacts/review/prepare_review/context-manifest.v1.json" --output-dir "$lane_dir"'
    on_failure: continue
    run_in: main

  - id: verify_idioms_maintainability_evidence
    kind: command
    depends_on: [materialize_idioms_maintainability]
    run: 'bundle_dir=${SCHERZO_WORKFLOW_BUNDLE_DIR:-}; if [ -z "$bundle_dir" ]; then bundle_dir="$(cd "$SCHERZO_CONFIG_DIR/workflows" && pwd -P)"; fi; repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; lane_dir="$SCHERZO_RUN_ROOT/artifacts/review/lanes/idioms-maintainability"; mkdir -p "$lane_dir"; draft_path="$lane_dir/review-lane-draft.v1.json"; "$bundle_dir/scripts/scherzo-review" verify-evidence --lane idioms-maintainability --draft "$draft_path" --brief "$SCHERZO_RUN_ROOT/artifacts/review/prepare_review/review-brief.v1.json" --diff-file "$SCHERZO_RUN_ROOT/artifacts/review/prepare_review/diff.patch" --changed-files "$SCHERZO_RUN_ROOT/artifacts/review/prepare_review/changed-files.v1.json" --validation-status "$SCHERZO_RUN_ROOT/artifacts/review/prepare_review/validation-status.v1.json" --context-manifest "$SCHERZO_RUN_ROOT/artifacts/review/prepare_review/context-manifest.v1.json" --output-dir "$lane_dir"'
    on_failure: continue
    run_in: main

  - id: verify_security_performance_evidence
    kind: command
    depends_on: [materialize_security_performance]
    run: 'bundle_dir=${SCHERZO_WORKFLOW_BUNDLE_DIR:-}; if [ -z "$bundle_dir" ]; then bundle_dir="$(cd "$SCHERZO_CONFIG_DIR/workflows" && pwd -P)"; fi; repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; lane_dir="$SCHERZO_RUN_ROOT/artifacts/review/lanes/security-performance"; mkdir -p "$lane_dir"; draft_path="$lane_dir/review-lane-draft.v1.json"; "$bundle_dir/scripts/scherzo-review" verify-evidence --lane security-performance --draft "$draft_path" --brief "$SCHERZO_RUN_ROOT/artifacts/review/prepare_review/review-brief.v1.json" --diff-file "$SCHERZO_RUN_ROOT/artifacts/review/prepare_review/diff.patch" --changed-files "$SCHERZO_RUN_ROOT/artifacts/review/prepare_review/changed-files.v1.json" --validation-status "$SCHERZO_RUN_ROOT/artifacts/review/prepare_review/validation-status.v1.json" --context-manifest "$SCHERZO_RUN_ROOT/artifacts/review/prepare_review/context-manifest.v1.json" --output-dir "$lane_dir"'
    on_failure: continue
    run_in: main

  - id: normalize_correctness
    kind: command
    depends_on: [verify_correctness_evidence]
    run: 'bundle_dir=${SCHERZO_WORKFLOW_BUNDLE_DIR:-}; if [ -z "$bundle_dir" ]; then bundle_dir="$(cd "$SCHERZO_CONFIG_DIR/workflows" && pwd -P)"; fi; repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; lane_dir="$SCHERZO_RUN_ROOT/artifacts/review/lanes/correctness"; artifact_dir="${SCHERZO_RUN_ARTIFACT_DIR:-$SCHERZO_RUN_ROOT/.scherzo-state/artifacts/runs/$SCHERZO_RUN_ID}"; if [ ! -e "$artifact_dir" ]; then artifact_dir="$(cd "$SCHERZO_RUN_ROOT/../../.." && pwd -P)/.scherzo-state/artifacts/runs/$SCHERZO_RUN_ID"; fi; draft_path="$lane_dir/review-lane-draft.v1.json"; "$bundle_dir/scripts/scherzo-review" normalize-lane-result --lane correctness --draft "$draft_path" --evidence-ledger "$lane_dir/evidence-ledger.v1.json" --agent-artifact-dir "$artifact_dir" --brief "$SCHERZO_RUN_ROOT/artifacts/review/prepare_review/review-brief.v1.json" --output-dir "$lane_dir"'
    run_in: main

  - id: normalize_test_quality
    kind: command
    depends_on: [verify_test_quality_evidence]
    run: 'bundle_dir=${SCHERZO_WORKFLOW_BUNDLE_DIR:-}; if [ -z "$bundle_dir" ]; then bundle_dir="$(cd "$SCHERZO_CONFIG_DIR/workflows" && pwd -P)"; fi; repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; lane_dir="$SCHERZO_RUN_ROOT/artifacts/review/lanes/test-quality"; artifact_dir="${SCHERZO_RUN_ARTIFACT_DIR:-$SCHERZO_RUN_ROOT/.scherzo-state/artifacts/runs/$SCHERZO_RUN_ID}"; if [ ! -e "$artifact_dir" ]; then artifact_dir="$(cd "$SCHERZO_RUN_ROOT/../../.." && pwd -P)/.scherzo-state/artifacts/runs/$SCHERZO_RUN_ID"; fi; draft_path="$lane_dir/review-lane-draft.v1.json"; "$bundle_dir/scripts/scherzo-review" normalize-lane-result --lane test-quality --draft "$draft_path" --evidence-ledger "$lane_dir/evidence-ledger.v1.json" --agent-artifact-dir "$artifact_dir" --brief "$SCHERZO_RUN_ROOT/artifacts/review/prepare_review/review-brief.v1.json" --output-dir "$lane_dir"'
    run_in: main

  - id: normalize_idioms_maintainability
    kind: command
    depends_on: [verify_idioms_maintainability_evidence]
    run: 'bundle_dir=${SCHERZO_WORKFLOW_BUNDLE_DIR:-}; if [ -z "$bundle_dir" ]; then bundle_dir="$(cd "$SCHERZO_CONFIG_DIR/workflows" && pwd -P)"; fi; repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; lane_dir="$SCHERZO_RUN_ROOT/artifacts/review/lanes/idioms-maintainability"; artifact_dir="${SCHERZO_RUN_ARTIFACT_DIR:-$SCHERZO_RUN_ROOT/.scherzo-state/artifacts/runs/$SCHERZO_RUN_ID}"; if [ ! -e "$artifact_dir" ]; then artifact_dir="$(cd "$SCHERZO_RUN_ROOT/../../.." && pwd -P)/.scherzo-state/artifacts/runs/$SCHERZO_RUN_ID"; fi; draft_path="$lane_dir/review-lane-draft.v1.json"; "$bundle_dir/scripts/scherzo-review" normalize-lane-result --lane idioms-maintainability --draft "$draft_path" --evidence-ledger "$lane_dir/evidence-ledger.v1.json" --agent-artifact-dir "$artifact_dir" --brief "$SCHERZO_RUN_ROOT/artifacts/review/prepare_review/review-brief.v1.json" --output-dir "$lane_dir"'
    run_in: main

  - id: normalize_security_performance
    kind: command
    depends_on: [verify_security_performance_evidence]
    run: 'bundle_dir=${SCHERZO_WORKFLOW_BUNDLE_DIR:-}; if [ -z "$bundle_dir" ]; then bundle_dir="$(cd "$SCHERZO_CONFIG_DIR/workflows" && pwd -P)"; fi; repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; lane_dir="$SCHERZO_RUN_ROOT/artifacts/review/lanes/security-performance"; artifact_dir="${SCHERZO_RUN_ARTIFACT_DIR:-$SCHERZO_RUN_ROOT/.scherzo-state/artifacts/runs/$SCHERZO_RUN_ID}"; if [ ! -e "$artifact_dir" ]; then artifact_dir="$(cd "$SCHERZO_RUN_ROOT/../../.." && pwd -P)/.scherzo-state/artifacts/runs/$SCHERZO_RUN_ID"; fi; draft_path="$lane_dir/review-lane-draft.v1.json"; "$bundle_dir/scripts/scherzo-review" normalize-lane-result --lane security-performance --draft "$draft_path" --evidence-ledger "$lane_dir/evidence-ledger.v1.json" --agent-artifact-dir "$artifact_dir" --brief "$SCHERZO_RUN_ROOT/artifacts/review/prepare_review/review-brief.v1.json" --output-dir "$lane_dir"'
    run_in: main

  - id: synthesize_review
    kind: command
    depends_on: [normalize_correctness, normalize_test_quality, normalize_idioms_maintainability, normalize_security_performance]
    run: 'bundle_dir=${SCHERZO_WORKFLOW_BUNDLE_DIR:-}; if [ -z "$bundle_dir" ]; then bundle_dir="$(cd "$SCHERZO_CONFIG_DIR/workflows" && pwd -P)"; fi; repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; "$bundle_dir/scripts/scherzo-review" synthesize --brief "$SCHERZO_RUN_ROOT/artifacts/review/prepare_review/review-brief.v1.json" --lane-result "$SCHERZO_RUN_ROOT/artifacts/review/lanes/correctness/review-lane-correctness.v1.json" --lane-result "$SCHERZO_RUN_ROOT/artifacts/review/lanes/test-quality/review-lane-test-quality.v1.json" --lane-result "$SCHERZO_RUN_ROOT/artifacts/review/lanes/idioms-maintainability/review-lane-idioms-maintainability.v1.json" --lane-result "$SCHERZO_RUN_ROOT/artifacts/review/lanes/security-performance/review-lane-security-performance.v1.json" --output-dir "$SCHERZO_RUN_ROOT/artifacts/review/synthesize_review"'
    run_in: main

  - id: validate_native_review_artifacts
    kind: command
    depends_on: [synthesize_review]
    run: |
      set -eu
      bundle_dir=${SCHERZO_WORKFLOW_BUNDLE_DIR:-}
      if [ -z "$bundle_dir" ]; then
        bundle_dir="$(cd "$SCHERZO_CONFIG_DIR/workflows" && pwd -P)"
      fi
      repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}
      synthesis="$SCHERZO_RUN_ROOT/artifacts/review/synthesize_review/review-synthesis.v1.json"
      final="$SCHERZO_RUN_ROOT/artifacts/review/synthesize_review/final-review.v1.json"
      "$bundle_dir/scripts/scherzo-review" validate --artifact "$synthesis"
      "$bundle_dir/scripts/scherzo-review" validate --artifact "$final"
      python3 - "$final" <<'PY'
      import json
      import sys

      final_path = sys.argv[1]
      with open(final_path, encoding="utf-8") as handle:
          artifact = json.load(handle)
      counts = artifact.get("finding_counts") if isinstance(artifact.get("finding_counts"), dict) else {}
      lane_failed = int(counts.get("lane_failed") or 0)
      execution_issues = artifact.get("execution_issues") if isinstance(artifact.get("execution_issues"), list) else []
      if lane_failed or execution_issues:
          print(
              "native review infrastructure issue blocks publication: "
              f"lane_failed={lane_failed} execution_issues={len(execution_issues)}",
              file=sys.stderr,
          )
          sys.exit(1)
      print("REVIEW_NATIVE_REVIEW_INFRASTRUCTURE=ok")
      PY
    run_in: main

  - id: code_review
    kind: agent
    depends_on: [validate_native_review_artifacts]
    prompt: prompts/code-review.md
    run_in: main

  - id: apply_feedback
    kind: agent
    depends_on: [code_review]
    prompt: prompts/apply-feedback.md
    run_in: main
    structured_output:
      format: json
      artifact_name: review_finding_disposition_input
      source:
        type: pi_tool_call
        tool_name: submit_review_finding_dispositions
        parameters_schema_path: .scherzo/workflows/schemas/provider/review-finding-dispositions.v1.schema.json
        require_single: true
        reject_sibling_tool_calls: true
      required: true
      validators:
        - name: review_finding_disposition_input_semantics
          type: command
          argv:
            - python3
            - .scherzo/workflows/scripts/scherzo-review
            - validate-structured-output
            - --validator
            - review_finding_disposition_input
          working_directory: repository
          timeout: 30s
        - name: review_finding_disposition_provider_shape
          type: json_schema
          path: .scherzo/workflows/schemas/provider/review-finding-dispositions.v1.schema.json
          draft: "2020-12"
        - name: review_finding_disposition_input_schema
          type: json_schema
          path: .scherzo/workflows/schemas/review-finding-disposition-input.v1.schema.json
          draft: "2020-12"
      schema:
        type: object
        required:
          - schema_version
          - artifact_type
          - entries

  - id: materialize_review_dispositions
    kind: command
    depends_on: [apply_feedback]
    run: 'bundle_dir=${SCHERZO_WORKFLOW_BUNDLE_DIR:-}; if [ -z "$bundle_dir" ]; then bundle_dir="$(cd "$SCHERZO_CONFIG_DIR/workflows" && pwd -P)"; fi; repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; artifact_dir="${SCHERZO_RUN_ARTIFACT_DIR:-$SCHERZO_RUN_ROOT/.scherzo-state/artifacts/runs/$SCHERZO_RUN_ID}"; if [ ! -e "$artifact_dir" ]; then artifact_dir="$(cd "$SCHERZO_RUN_ROOT/../../.." && pwd -P)/.scherzo-state/artifacts/runs/$SCHERZO_RUN_ID"; fi; "$bundle_dir/scripts/scherzo-review" materialize-disposition-input --artifact-dir "$artifact_dir" --submission-step apply_feedback --submission-artifact review_finding_disposition_input --output tmp/review-finding-dispositions.v1.json'
    run_in: main

  - id: refresh_base_before_validation
    kind: command
    depends_on: [materialize_review_dispositions]
    run: 'bundle_dir=${SCHERZO_WORKFLOW_BUNDLE_DIR:-}; if [ -z "$bundle_dir" ]; then bundle_dir="$(cd "$SCHERZO_CONFIG_DIR/workflows" && pwd -P)"; fi; repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; "$bundle_dir/scripts/scherzo-implementation" refresh-base --stage before-validation'
    timeout: 5m
    on_failure: continue
    run_in: main

  - id: validate_after_refresh
    kind: command
    depends_on: [refresh_base_before_validation]
    run: 'bundle_dir=${SCHERZO_WORKFLOW_BUNDLE_DIR:-}; if [ -z "$bundle_dir" ]; then bundle_dir="$(cd "$SCHERZO_CONFIG_DIR/workflows" && pwd -P)"; fi; repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; "$bundle_dir/scripts/scherzo-implementation" validate'
    timeout: 20m
    on_failure: continue
    run_in: main

  - id: repair_base_drift
    kind: agent
    depends_on: [validate_after_refresh]
    prompt: prompts/repair-base-drift.md
    run_in: main

  - id: final_validate
    kind: command
    depends_on: [repair_base_drift]
    run: 'bundle_dir=${SCHERZO_WORKFLOW_BUNDLE_DIR:-}; if [ -z "$bundle_dir" ]; then bundle_dir="$(cd "$SCHERZO_CONFIG_DIR/workflows" && pwd -P)"; fi; repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; "$bundle_dir/scripts/scherzo-implementation" validate'
    timeout: 20m
    run_in: main

  - id: finalize_review_dispositions
    kind: command
    depends_on: [final_validate]
    run: 'bundle_dir=${SCHERZO_WORKFLOW_BUNDLE_DIR:-}; if [ -z "$bundle_dir" ]; then bundle_dir="$(cd "$SCHERZO_CONFIG_DIR/workflows" && pwd -P)"; fi; repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; diff_path=""; if [ -f "$SCHERZO_RUN_ROOT/input.diff" ]; then diff_path=" --diff-file $SCHERZO_RUN_ROOT/input.diff"; fi; "$bundle_dir/scripts/scherzo-review" finalize-dispositions --final-review "$SCHERZO_RUN_ROOT/artifacts/review/synthesize_review/final-review.v1.json" --disposition-input tmp/review-finding-dispositions.v1.json --validation-artifact tmp/scherzo-implementation-validation.json --output-dir "$SCHERZO_RUN_ROOT/artifacts/review/final_dispositions" --require-publishable${diff_path}'
    run_in: main

  - id: publish_pr
    kind: command
    depends_on: [finalize_review_dispositions]
    run: 'bundle_dir=${SCHERZO_WORKFLOW_BUNDLE_DIR:-}; if [ -z "$bundle_dir" ]; then bundle_dir="$(cd "$SCHERZO_CONFIG_DIR/workflows" && pwd -P)"; fi; repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; "$bundle_dir/scripts/scherzo-implementation" publish'
    timeout: 5m
    run_in: main
    recovery:
      enabled: false
