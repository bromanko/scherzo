# yaml-language-server: $schema=../../schemas/scherzo.workflow.v1.schema.json
version: 1
id: workspace-cleanup
description: Inventory and clean up eligible Scherzo-owned local state and delegated workspaces under the configured workspace root.
workspace:
  driver: noop
concurrency: 1
steps:
  - id: cleanup
    kind: command
    run: |
      set -eu

      config_dir=$(cd "$SCHERZO_CONFIG_DIR" && pwd -P)
      repo_root=${SCHERZO_REPO_ROOT:-$(cd "$config_dir/.." && pwd -P)}
      workspace_root=${SCHERZO_CLEANUP_WORKSPACE_ROOT:-${SCHERZO_WORKSPACE_CLEANUP_ROOT:-}}
      if test -z "$workspace_root"; then
        workspace_root="$config_dir/workspaces"
      fi

      run_cleanup() {
        if test -n "${SCHERZO_CTL:-}"; then
          "$SCHERZO_CTL" cleanup "$@"
          return
        fi
        if test -n "${SCHERZO_BIN:-}"; then
          "$SCHERZO_BIN" cleanup "$@"
          return
        fi
        if command -v scherzo >/dev/null 2>&1; then
          scherzo cleanup "$@"
          return
        fi
        if command -v scherzoctl >/dev/null 2>&1; then
          scherzoctl cleanup "$@"
          return
        fi
        if test -x "$repo_root/scripts/scherzoctl"; then
          "$repo_root/scripts/scherzoctl" cleanup "$@"
          return
        fi
        if command -v direnv >/dev/null 2>&1 && test -f "$repo_root/.envrc"; then
          direnv exec "$repo_root" gleam run -- cleanup "$@"
          return
        fi
        echo "scherzo cleanup not found; set SCHERZO_BIN or SCHERZO_CTL, or add scherzo/scherzoctl to PATH" >&2
        exit 127
      }

      cleanup_state_dir="$workspace_root/.scherzo-state/cleanup/scheduled"
      cleanup_cursor_path="$cleanup_state_dir/workspace-cleanup.cursor"
      mkdir -p "$cleanup_state_dir"

      cleanup_once() {
        if test -f "$cleanup_cursor_path"; then
          saved_cursor=$(python3 -c 'import pathlib,sys; print(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8").strip())' "$cleanup_cursor_path")
        else
          saved_cursor=""
        fi

        if test -n "$saved_cursor"; then
          run_cleanup --root "$workspace_root" --json --yes --limit 100 --max-runtime-ms 240000 --cursor "$saved_cursor"
        else
          run_cleanup --root "$workspace_root" --json --yes --limit 100 --max-runtime-ms 240000
        fi
      }

      cleanup_stderr_path="$cleanup_state_dir/workspace-cleanup.stderr.$$"
      rm -f "$cleanup_stderr_path"
      cleanup_output=$(cleanup_once 2>"$cleanup_stderr_path") || cleanup_status=$?
      cleanup_status=${cleanup_status:-0}
      cleanup_stderr=""
      if test -f "$cleanup_stderr_path"; then
        cleanup_stderr=$(cat "$cleanup_stderr_path")
        rm -f "$cleanup_stderr_path"
      fi
      if test "$cleanup_status" -ne 0; then
        cleanup_failure=$(printf '%s\n%s' "$cleanup_output" "$cleanup_stderr")
        case "$cleanup_failure" in
          *cleanup_malformed_cursor*|*cleanup_wrong_root*|*cleanup_unknown_provider*|*cleanup_unknown_version*)
            rm -f "$cleanup_cursor_path"
            exit 0
            ;;
          *)
            printf '%s\n' "$cleanup_failure" >&2
            exit "$cleanup_status"
            ;;
        esac
      fi

      if test -n "$cleanup_stderr"; then
        printf '%s\n' "$cleanup_stderr" >&2
      fi
      printf '%s\n' "$cleanup_output"
      python3 - "$cleanup_cursor_path" "$cleanup_output" <<'PY'
      import json
      import os
      import pathlib
      import sys
      import tempfile

      cursor_path = pathlib.Path(sys.argv[1])
      payload = json.loads(sys.argv[2])
      if payload.get("truncated") and payload.get("next_cursor"):
          cursor_path.parent.mkdir(parents=True, exist_ok=True)
          handle = tempfile.NamedTemporaryFile(
              "w",
              dir=str(cursor_path.parent),
              delete=False,
              encoding="utf-8",
          )
          handle.write(payload["next_cursor"] + "\n")
          handle.close()
          os.replace(handle.name, cursor_path)
      else:
          cursor_path.unlink(missing_ok=True)
      PY
    timeout: 5m
    run_in: main
