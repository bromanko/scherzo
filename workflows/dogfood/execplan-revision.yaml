# yaml-language-server: $schema=../../schemas/scherzo.workflow.v1.schema.json
version: 1
id: execplan-revision
description: Revise a previously retained ExecPlan bundle from review feedback and emit a superseding exec_plan_bundle.
workspace:
  driver: dogfood-jj
  requires: [status, diff, changed-files, refresh-base, publish-commit-stack]
concurrency: 1
contract:
  version: 1
  inputs:
    feedback:
      kind: file
      media_type: text/plain
      required: true
      source: issue_context
    exec_plan_bundle:
      kind: artifact_set
      media_type: application/json
      artifact_type: scherzo.exec_plan_bundle.v2
      required: false
      source: mapped_output
  outputs:
    plan:
      kind: file
      media_type: text/markdown
      artifact_type: scherzo.exec_plan.v1
      source:
        step: materialize_revision
        path: state/implementation/execplan-review-doc.md
    implementation_pack:
      kind: file
      media_type: application/json
      artifact_type: scherzo.implementation_pack.v2
      source:
        step: materialize_pack
        path: state/implementation/execplan-implementation-pack.json
    exec_plan_bundle:
      kind: artifact_set
      media_type: application/json
      artifact_type: scherzo.exec_plan_bundle.v2
      source:
        step: materialize_revision
        path: state/implementation/execplan-bundle.json
    commit_stack:
      kind: commit_stack
      media_type: application/vnd.scherzo.git-commit-stack+json
      artifact_type: scherzo.git_commit_stack.v1
      source:
        step: materialize_commit_stack
        path: state/implementation/execplan-commit-stack.json
    publication_target:
      kind: value
      media_type: application/json
      artifact_type: scherzo.github_publication_target.v1
      source:
        step: materialize_commit_stack
        path: state/implementation/execplan-publication-target.json
artifacts:
  publications:
    - id: execplan_review_doc
      repository: github.code
      required: true
      mode: commit_stack
      commit_stack:
        select:
          output: commit_stack
      target:
        kind: sourced
        source:
          output: publication_target
workstream_phase:
  phase_id: execplan_revision
  display_name: ExecPlan revised
  handoff:
    output: exec_plan_bundle
    artifact_type: scherzo.handoff.v1
    snapshot: required
  next_actions:
    - action_id: implement_exec_plan
      workflow_id: execplan-implementation
      state: suggested
      priority: 0
      inputs: [exec_plan_bundle]
      requires_gate: human_review
      auto_enqueue: false
    - action_id: revise_exec_plan
      workflow_id: execplan-revision
      state: suggested
      priority: 1
      inputs: [exec_plan_bundle]
      auto_enqueue: false
steps:
  - id: prepare_revision
    kind: command
    run: ': "${SCHERZO_WORKFLOW_BUNDLE_DIR:?Scherzo command-step contract missing SCHERZO_WORKFLOW_BUNDLE_DIR}"; "$SCHERZO_WORKFLOW_BUNDLE_DIR/scripts/scherzo-execplan" prepare-revision --prefer-workstream-input --write-bundle tmp/execplan-previous-bundle.json --write-review-doc-path tmp/execplan-review-doc.path --write-pack tmp/execplan-previous-pack.json'
    timeout: 5m
    run_in: main

  - id: revise_plan
    kind: agent
    depends_on: [prepare_revision]
    prompt: prompts/execplan-revision.md
    run_in: main
    structured_output:
      format: json
      artifact_name: implementation_pack_submission
      source:
        type: pi_tool_call
        tool_name: submit_implementation_pack_submission
        parameters_schema_path: .scherzo/workflows/schemas/provider/exec-plan-revision-submission.v2.schema.json
      required: true
      validators:
        - name: exec_plan_revision_submission_provider_shape
          type: json_schema
          path: .scherzo/workflows/schemas/provider/exec-plan-revision-submission.v2.schema.json
          draft: "2020-12"
        - name: exec_plan_revision_submission_shape
          type: json_schema
          path: .scherzo/workflows/schemas/exec-plan-revision-submission.v2.schema.json
          draft: "2020-12"

  - id: validate_review_doc_after_revision
    kind: command
    depends_on: [revise_plan]
    run: ': "${SCHERZO_WORKFLOW_BUNDLE_DIR:?Scherzo command-step contract missing SCHERZO_WORKFLOW_BUNDLE_DIR}"; review_doc_path=$(cat tmp/execplan-review-doc.path); "$SCHERZO_WORKFLOW_BUNDLE_DIR/scripts/scherzo-execplan" validate-review-doc --path "$review_doc_path"'
    run_in: main

  - id: materialize_pack
    kind: command
    depends_on: [validate_review_doc_after_revision]
    run: ': "${SCHERZO_WORKFLOW_BUNDLE_DIR:?Scherzo command-step contract missing SCHERZO_WORKFLOW_BUNDLE_DIR}"; : "${SCHERZO_RUN_ARTIFACT_DIR:?Scherzo command-step contract missing SCHERZO_RUN_ARTIFACT_DIR}"; "$SCHERZO_WORKFLOW_BUNDLE_DIR/scripts/scherzo-execplan" materialize-pack --review-doc-path-file tmp/execplan-review-doc.path --submission-step revise_plan --submission-artifact implementation_pack_submission --output "$SCHERZO_RUN_ROOT/state/implementation/execplan-implementation-pack.json"'
    run_in: main

  - id: materialize_commit_stack
    kind: command
    depends_on: [materialize_pack]
    run: ': "${SCHERZO_WORKFLOW_BUNDLE_DIR:?Scherzo command-step contract missing SCHERZO_WORKFLOW_BUNDLE_DIR}"; : "${SCHERZO_RUN_ARTIFACT_DIR:?Scherzo command-step contract missing SCHERZO_RUN_ARTIFACT_DIR}"; "$SCHERZO_WORKFLOW_BUNDLE_DIR/scripts/scherzo-execplan" materialize-commit-stack --review-doc-path-file tmp/execplan-review-doc.path --previous-bundle tmp/execplan-previous-bundle.json --target-output "$SCHERZO_RUN_ROOT/state/implementation/execplan-publication-target.json" --output "$SCHERZO_RUN_ROOT/state/implementation/execplan-commit-stack.json"'
    timeout: 5m
    run_in: main

  - id: materialize_revision
    kind: command
    depends_on: [materialize_commit_stack]
    run: ': "${SCHERZO_WORKFLOW_BUNDLE_DIR:?Scherzo command-step contract missing SCHERZO_WORKFLOW_BUNDLE_DIR}"; "$SCHERZO_WORKFLOW_BUNDLE_DIR/scripts/scherzo-execplan" materialize-revision --previous-bundle tmp/execplan-previous-bundle.json --review-doc-path-file tmp/execplan-review-doc.path --pack "$SCHERZO_RUN_ROOT/state/implementation/execplan-implementation-pack.json" --status auto --output "$SCHERZO_RUN_ROOT/state/implementation/execplan-bundle.json"'
    timeout: 5m
    run_in: main
