version: 1
id: structured-output-legacy-review-validator
steps:
  - id: produce_review
    kind: agent
    prompt: prompts/review.md
    workspace: main
    structured_output:
      artifact_name: review_lane_draft
      required: true
      format: json
      source:
        type: final_response
      schema:
        type: object
        required:
          - schema_version
          - artifact_type
      validator: review_lane_draft
      validation_retries: 1
