# yaml-language-server: $schema=../../../schemas/scherzo.workflow.v1.schema.json
version: 1
id: implementation
description: Two-step implementation workflow fixture
concurrency: 2
steps:
  - id: implement
    kind: agent
    prompt: prompts/implement.md
    run_in: main
    model: github-copilot/gpt-5.1-codex
    thinking: high
  - id: test
    kind: command
    depends_on: [implement]
    run: direnv exec . gleam test
    timeout: 2m
    run_in:
      name: test-workspace
      from: main
    on_failure: continue
