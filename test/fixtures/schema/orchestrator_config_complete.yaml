version: 1
tracker:
  kind: linear
  api_key: "$LINEAR_API_KEY"
  project_slug: "$LINEAR_PROJECT_SLUG"
  active_states: [Todo, "In Progress"]
  dispatch_states: [Todo]
  terminal_states: [Done, Canceled]
polling:
  interval: 45s
workspace:
  root: workspaces
  default_profile: fixture
  profiles:
    fixture:
      driver:
        command: scripts/scherzo-workspace-noop
        lifecycle: [create, before-step, after-step, remove]
        timeout: 1234ms
hooks:
  before_run: test -d .git
  after_run: echo done
  timeout: 90s
agent:
  max_concurrent_agents: 3
  max_turns: 12
  max_retry_backoff: 1m
  max_retry_attempts: 2
  max_sessions_per_issue: 2
  max_concurrent_agents_by_state:
    todo: 1
pi:
  command: pi --mode rpc --no-session --rpc-message-updates off
  argv: [pi, "--mode", rpc, "--rpc-message-updates", "off"]
  argv_env:
    PI_LOG: debug
  turn_timeout: 10m
  read_timeout: 7s
  stall_timeout: 2m
  auto_retry: false
  ui_request_policy: operator
  ui_request_timeout: 10s
  compatibility_probe: false
  session_persistence:
    enabled: true
    recovery_prompt: Resume safely.
  model: github-copilot/gpt-5.1-codex
  thinking: high
handoff:
  enabled: true
  comment_on_claim: true
  comment_on_success: true
  comment_on_failure: false
  comment_on_park: true
  claim_state_id: state-claim
  success_state_id: state-success
  failure_state_id: state-fail
  include_result_on_success: true
  attach_result_on_success: true
  attachment_fallback_to_markdown_link: false
  result_max_chars: 4000
  completion_states:
    default_completion_state: In Review
    no_review_completion_state: Done
    failure_state: Needs Attention
    partial_success_state: Needs Attention
    workflows:
      implementation:
        produces_reviewable_artifacts: true
        requires_review: true
linear_contract:
  enabled: true
  workflow_label_prefix: "workflow:"
  workflow_labels: [implementation]
  support_labels: [needs-workflow]
  required_states:
    todo: Todo
    done: Done
  handoff_state_bindings:
    claim: todo
    success: done
  enforce_issue_workflow_labels: true
  invalid_workflow_state_id: state-invalid
  comment_on_invalid_workflow: true
routing:
  workflow_label_prefix: "workflow:"
  require_exactly_one_workflow_label: true
  default_workflow: implementation
  workflows:
    implementation: workflows/implementation.yaml
artifact_limits:
  command_stream_max_chars: 111
  template_field_max_chars: 222
  workflow_summary_max_chars: 333
scheduled_jobs:
  - id: nightly-repair
    workflow: implementation
    enabled: true
    every: 15m
    overlap: skip
    catch_up: false
    on_failure:
      linear:
        enabled: true
        state: Triage
        labels: [job:nightly-repair]
        dedupe: open_issue_per_job
