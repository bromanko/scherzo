version: 1
tracker:
  kind: linear
  api_key: "$LINEAR_API_KEY"
  linear:
    project: "$LINEAR_PROJECT_SLUG"
    check_setup: true
    labels:
      support: [needs-workflow]
  states:
    ready: [Todo]
    active: [Todo, "In Progress"]
    terminal: [Done, Canceled]
  polling:
    every: 45s
workspace:
  root: workspaces
  driver: fixture
  drivers:
    fixture:
      type: custom
      command: scripts/scherzo-workspace-noop
      timeout: 1234ms
hooks:
  before_run: test -d .git
  after_run: echo done
  timeout: 90s
agents:
  concurrency:
    default: 3
    by_state:
      todo: 1
  max_turns: 12
  sessions_per_task: 2
  model: github-copilot/gpt-5.1-codex
  thinking: high
  retries:
    max_backoff: 1m
    attempts: 2
  runtime:
    type: pi
    sessions: persistent
    pi:
      executable: pi
      args: []
      env:
        PI_LOG: debug
    turn_timeout: 10m
    read_timeout: 7s
    stall_timeout: 2m
    auto_retry: false
    ui_requests: operator
    ui_request_timeout: 10s
    compatibility_check: false
task_updates:
  enabled: true
  states:
    claim: In Progress
    success: In Review
    no_review_success: Done
    failure: Needs Attention
    partial_success: Triage
  comment_on: [claim, success, park]
  result:
    on_success: attachment
    max_chars: 4000
task_routing:
  labels:
    prefix: "workflow:"
    require_exactly_one: true
    default_workflow: implementation
    on_invalid:
      state: Triage
      comment: true
workflows:
  implementation: workflows/implementation.yaml
  nightly-repair: workflows/nightly-repair.yaml
artifact_limits:
  command_stream_max_chars: 111
  template_field_max_chars: 222
  workflow_summary_max_chars: 333
scheduled_jobs:
  - id: nightly-repair
    workflow: nightly-repair
    enabled: true
    every: 15m
    overlap: skip
    catch_up: false
    on_failure:
      linear:
        enabled: true
        state: Triage
        labels: [job:nightly-repair]
        dedupe: open_issue_per_job
