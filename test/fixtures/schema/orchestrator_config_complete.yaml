version: 1
tracker:
  kind: linear
  api_key: "$LINEAR_API_KEY"
  linear:
    project: "$LINEAR_PROJECT_SLUG"
  states:
    ready: [Todo]
    active: [Todo, "In Progress"]
    terminal: [Done, Canceled]
  polling:
    every: 45s
workspace:
  root: workspaces
  driver: fixture
  drivers:
    fixture:
      type: custom
      command: scripts/scherzo-workspace-noop
      timeout: 1234ms
hooks:
  before_run: test -d .git
  after_run: echo done
  timeout: 90s
agents:
  concurrency:
    default: 3
    by_state:
      todo: 1
  max_turns: 12
  sessions_per_task: 2
  model: github-copilot/gpt-5.1-codex
  thinking: high
  retries:
    max_backoff: 1m
    attempts: 2
  runtime:
    type: pi
    sessions: persistent
    pi:
      executable: pi
      args: []
      env:
        PI_LOG: debug
    turn_timeout: 10m
    read_timeout: 7s
    stall_timeout: 2m
    auto_retry: false
    ui_requests: operator
    ui_request_timeout: 10s
    compatibility_check: false
task_updates:
  enabled: true
  states:
    claim: In Progress
    success: In Review
    no_review_success: Done
    failure: Needs Attention
    partial_success: Triage
  comment_on: [claim, success, park]
  result:
    on_success: attachment
    max_chars: 4000
linear_contract:
  enabled: true
  workflow_label_prefix: "workflow:"
  workflow_labels: [implementation]
  support_labels: [needs-workflow]
  required_states:
    todo: Todo
    done: Done
  handoff_state_bindings:
    claim: todo
    success: done
  enforce_issue_workflow_labels: true
  invalid_workflow_state_id: state-invalid
  comment_on_invalid_workflow: true
task_routing:
  labels:
    prefix: "workflow:"
    require_exactly_one: true
    default_workflow: implementation
workflows:
  implementation: workflows/implementation.yaml
artifacts:
  limits:
    command_output_chars: 111
    template_field_chars: 222
    workflow_summary_chars: 333
schedules:
  - id: nightly-repair
    workflow: implementation
    enabled: true
    every: 15m
    overlap: skip
    catch_up: false
    on_failure:
      task:
        enabled: true
        state: Triage
        labels: [job:nightly-repair]
        dedupe: open_task_per_schedule
