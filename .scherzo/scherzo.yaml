version: 1
tracker:
  kind: linear
  endpoint: https://api.linear.app/graphql
  api_key: "$LINEAR_API_KEY"
  project_slug: scherzo-f6f4bc92d6d7
  active_states: [Todo, In Progress]
  terminal_states: [Canceled, Duplicate, Done]
polling:
  interval_ms: 30000
workspace:
  # Paths are resolved relative to .scherzo/scherzo.yaml. Runtime workspaces
  # land under repo-root/.scherzo/workspaces/<workflow>/<issue>/<run>/.
  root: workspaces
  hooks:
    create: |
      set -eu
      repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}
      mkdir -p "$SCHERZO_WORKSPACE_PATH"
      cd "$SCHERZO_WORKSPACE_PATH"
      SCHERZO_REPO_ROOT="$repo_root" sh "$repo_root/scripts/scherzo-jj-workspace" after-create "$SCHERZO_WORKFLOW_ID"
    before_step: |
      set -eu
      repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}
      cd "$SCHERZO_WORKSPACE_PATH"
      SCHERZO_REPO_ROOT="$repo_root" sh "$repo_root/scripts/scherzo-jj-workspace" before-run "$SCHERZO_WORKFLOW_ID"
    after_step: |
      true
    remove: |
      set -eu
      repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}
      workflow_name=${SCHERZO_WORKFLOW_ID:-$(basename "$(dirname "$(dirname "$SCHERZO_WORKSPACE_PATH")")")}
      if [ -d "$SCHERZO_WORKSPACE_PATH" ]; then
        for workspace_dir in "$SCHERZO_WORKSPACE_PATH"/*; do
          [ -e "$workspace_dir" ] || continue
          if [ -d "$workspace_dir/.jj" ]; then
            (cd "$workspace_dir" && SCHERZO_REPO_ROOT="$repo_root" sh "$repo_root/scripts/scherzo-jj-workspace" before-remove "$workflow_name")
          fi
        done
      fi
    timeout_ms: 60000
agent:
  # First dogfood runs should be supervised and serial. Set to 0 to pause new
  # dispatch while preserving workflow reload and running-worker reconciliation.
  max_concurrent_agents: 1
  # One pi turn is a full agent loop with tool calls. Keep dogfood workflow
  # steps single-turn so active Linear issues do not repeat until max_turns.
  max_turns: 1
  max_retry_backoff_ms: 300000
  max_retry_attempts: 2
  max_sessions_per_issue: 2
pi:
  command: 'repo_root=${SCHERZO_REPO_ROOT:-$(pwd -P | sed "s#/.scherzo/workspaces/.*##")}; exec "$repo_root/scripts/scherzo-pi"'
  turn_timeout_ms: 3600000
  read_timeout_ms: 5000
  stall_timeout_ms: 300000
  auto_retry: true
  # Route extension UI requests to the operator through scherzoctl attach/ui.
  ui_request_policy: operator
  ui_request_timeout_ms: 600000
  compatibility_probe: true
handoff:
  # Move issues through the checked Linear states so successful daemon runs do
  # not redispatch the same still-active issue on the next poll. Report the
  # workflow result inline; keep full Markdown attachments off unless a workflow
  # explicitly needs them later.
  enabled: true
  comment_on_claim: true
  comment_on_success: true
  comment_on_failure: true
  claim_state_id: 2e245854-2a96-4ebf-9b67-cbef92ca9a1f
  success_state_id: dbd4662f-635f-4a8d-acd7-cef0def44196
  failure_state_id: 83eb55af-4c17-443f-9501-8a581be7de20
  include_result_on_success: true
  attach_result_on_success: false
  attachment_fallback_to_markdown_link: false
  result_max_chars: 20000
routing:
  workflow_label_prefix: "workflow:"
  require_exactly_one_workflow_label: true
  workflows:
    research: workflows/research.yaml
    implementation: workflows/implementation.yaml
    execplan: workflows/execplan.yaml
artifact_limits:
  command_stream_max_chars: 20000
  template_field_max_chars: 8000
  workflow_summary_max_chars: 20000
linear_contract:
  enabled: true
  workflow_label_prefix: "workflow:"
  workflow_labels: [research, implementation, execplan]
  support_labels: [needs-workflow, needs-clarification]
  required_states:
    todo: Todo
    in_progress: In Progress
    done: Done
    needs_workflow: Needs Workflow
  handoff_state_bindings:
    claim: in_progress
    success: done
    failure: needs_workflow
  enforce_issue_workflow_labels: true
  comment_on_invalid_workflow: false
linear_commands:
  # Keep Linear comment commands off for the first dogfood loop. Use the local
  # control API (`scripts/scherzoctl`) for supervision and follow-up prompts.
  enabled: false
  prefix: "/scherzo"
  authorized_user_ids: []
  poll_limit_per_issue: 25
  max_comments_per_tick: 50
  acknowledge_success: true
  acknowledge_rejection: true
