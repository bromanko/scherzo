version: 1
tracker:
  kind: linear
  endpoint: https://api.linear.app/graphql
  api_key: "$LINEAR_API_KEY"
  project_slug: scherzo-f6f4bc92d6d7
  active_states: [Todo, In Progress]
  dispatch_states: [Todo]
  terminal_states: [Canceled, Duplicate, Done]
polling:
  interval_ms: 30000
workspace:
  # Paths are resolved relative to .scherzo/scherzo.yaml. Runtime workspaces
  # land under repo-root/.scherzo/workspaces/<workflow>/<issue>/<run>/.
  root: workspaces
  # All checked-in dogfood workflows select dogfood-jj explicitly. Keep the
  # same named profile as the documented default for ad-hoc routed workflows.
  default_profile: dogfood-jj
  profiles:
    dogfood-jj:
      driver:
        command: "$SCHERZO_REPO_ROOT/scripts/scherzo-workspace-jj"
        lifecycle: [create, before-step, after-step, remove]
        capabilities: [status, diff, changed-files, assert-only, baseline, refresh-base, publish-change]
        timeout_ms: 60000
agent:
  # Allow up to four dogfood agents to run in parallel. Set to 0 to pause new
  # dispatch while preserving workflow reload and running-worker reconciliation.
  max_concurrent_agents: 4
  # One pi turn is a full agent loop with tool calls. Keep this at 1 unless a
  # workflow explicitly needs same-session continuation turns before handoff.
  max_turns: 1
  max_retry_backoff_ms: 300000
  max_retry_attempts: 2
  max_sessions_per_issue: 2
pi:
  command: 'repo_root=${SCHERZO_REPO_ROOT:-$(pwd -P | sed "s#/.scherzo/workspaces/.*##")}; exec "$repo_root/scripts/scherzo-pi"'
  turn_timeout_ms: 3600000
  read_timeout_ms: 5000
  stall_timeout_ms: 300000
  auto_retry: true
  # Route extension UI requests to the operator through scherzoctl attach/ui.
  ui_request_policy: operator
  ui_request_timeout_ms: 600000
  compatibility_probe: true
handoff:
  # Move issues through the checked Linear states so successful daemon runs do
  # not redispatch the same still-active issue on the next poll. Keep success
  # comments short and upload the full Markdown result as a Linear comment file.
  enabled: true
  comment_on_claim: true
  comment_on_success: true
  comment_on_failure: true
  claim_state_id: 2e245854-2a96-4ebf-9b67-cbef92ca9a1f
  success_state_id: dbd4662f-635f-4a8d-acd7-cef0def44196
  failure_state_id: 83eb55af-4c17-443f-9501-8a581be7de20
  include_result_on_success: false
  attach_result_on_success: true
  attachment_fallback_to_markdown_link: true
  result_max_chars: 20000
routing:
  workflow_label_prefix: "workflow:"
  require_exactly_one_workflow_label: true
  workflows:
    research: workflows/research.yaml
    implementation: workflows/implementation.yaml
    execplan: workflows/execplan.yaml
    execplan-revision: workflows/execplan-revision.yaml
    execplan-implementation: workflows/execplan-implementation.yaml
    merge-conflict-resolution: workflows/merge-conflict-resolution.yaml
    github-pr-conflict-scout: workflows/github-pr-conflict-scout.yaml
scheduled_jobs:
  - id: github-pr-conflict-scout
    workflow: github-pr-conflict-scout
    enabled: true
    every: 15m
    overlap: skip
    catch_up: false
    on_failure:
      linear:
        enabled: true
        state: Triage
        labels:
          - job:github-pr-conflict-scout
        dedupe: open_issue_per_job
artifact_limits:
  command_stream_max_chars: 20000
  template_field_max_chars: 8000
  workflow_summary_max_chars: 20000
linear_contract:
  enabled: true
  workflow_label_prefix: "workflow:"
  workflow_labels: [research, implementation, execplan, execplan-revision, execplan-implementation, merge-conflict-resolution]
  support_labels: [needs-workflow, needs-clarification]
  required_states:
    todo: Todo
    in_progress: In Progress
    done: Done
    triage: Triage
  handoff_state_bindings:
    claim: in_progress
    success: done
    failure: triage
  enforce_issue_workflow_labels: true
  invalid_workflow_state_id: 83eb55af-4c17-443f-9501-8a581be7de20
  comment_on_invalid_workflow: true
linear_commands:
  # Keep Linear comment commands off for the first dogfood loop. Use the local
  # control API (`scripts/scherzoctl`) for supervision and follow-up prompts.
  enabled: false
  prefix: "/scherzo"
  authorized_user_ids: []
  poll_limit_per_issue: 25
  max_comments_per_tick: 50
  acknowledge_success: true
  acknowledge_rejection: true
