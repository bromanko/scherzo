version: 1
tracker:
  kind: linear
  credentials:
    api_key_env: LINEAR_API_KEY
  linear:
    endpoint: https://api.linear.app/graphql
    project: scherzo-f6f4bc92d6d7
  states:
    ready: [Todo]
    active: [Todo, In Progress]
    terminal: [Canceled, Duplicate, Done]
  polling:
    every: 60s
workspace:
  # Paths are resolved relative to .scherzo/scherzo.yaml. Runtime workspaces
  # land under repo-root/.scherzo/workspaces/<workflow>/<issue>/<run>/.
  root: workspaces
  # All checked-in dogfood workflows select dogfood-jj explicitly. Keep the
  # same named profile as the documented default for ad-hoc routed workflows.
  default_profile: dogfood-jj
  profiles:
    dogfood-jj:
      driver:
        command: "$SCHERZO_REPO_ROOT/scripts/scherzo-workspace-jj"
        lifecycle: [create, before-step, after-step, remove]
        timeout_ms: 60000
        env:
          SCHERZO_JJ_WORKSPACE_REMOTE: scherzo-agent
          SCHERZO_JJ_WORKSPACE_BASE_BRANCH: main
          SCHERZO_JJ_WORKSPACE_FETCH_BASE: "true"
          SCHERZO_JJ_WORKSPACE_PUBLISH_REMOTE: scherzo-agent
          SCHERZO_GITHUB_REPO: scherzo-systems/scherzo
    noop:
      driver:
        command: "$SCHERZO_REPO_ROOT/scripts/scherzo-workspace-noop"
        lifecycle: [create, before-step, after-step, remove]
        timeout_ms: 60000
        env:
          SCHERZO_GITHUB_REPO: scherzo-systems/scherzo
    origin-sync:
      driver:
        command: "$SCHERZO_REPO_ROOT/scripts/scherzo-workspace-noop"
        lifecycle: [create, before-step, after-step, remove]
        timeout_ms: 60000
        env:
          SCHERZO_GITHUB_REPO: scherzo-systems/scherzo
          SCHERZO_ORIGIN_SYNC_REMOTE: scherzo-agent
          SCHERZO_ORIGIN_SYNC_BRANCH: main
agents:
  # Allow up to four dogfood agents to run in parallel. Set to 0 to pause new
  # dispatch while preserving workflow reload and running-worker reconciliation.
  concurrency: 4
  # One pi turn is a full agent loop with tool calls. Keep this at 1 unless a
  # workflow explicitly needs same-session continuation turns before handoff.
  max_turns: 1
  sessions_per_task: 2
  retries:
    max_backoff: 5m
    attempts: 2
  runtime:
    type: pi
    sessions: persistent
    pi:
      executable: sh
      args:
        - "-c"
        - 'repo_root=${SCHERZO_REPO_ROOT:-$(pwd -P | sed "s#/.scherzo/workspaces/.*##")}; exec "$repo_root/scripts/scherzo-pi" "$@"'
        - scherzo-pi
      env:
        SCHERZO_PI_SESSION_PERSISTENCE: "1"
    turn_timeout: 1h
    read_timeout: 5s
    stall_timeout: 20m
    auto_retry: true
    # Route extension UI requests to the operator through scherzoctl attach/ui.
    ui_requests: operator
    ui_request_timeout: 10m
    compatibility_check: true
task_updates:
  # Move issues through the checked Linear states so successful daemon runs do
  # not redispatch the same still-active issue on the next poll.
  enabled: true
  states:
    claim: In Progress
    success: In Review
    no_review_success: Done
    failure: Triage
    partial_success: Triage
  comment_on: [claim, success, failure]
  result:
    on_success: attachment
    max_chars: 20000
workflows:
  research: workflows/research.yaml
  implementation: workflows/implementation.yaml
  execplan: workflows/execplan.yaml
  execplan-revision: workflows/execplan-revision.yaml
  execplan-implementation: workflows/execplan-implementation.yaml
  merge-conflict-resolution: workflows/merge-conflict-resolution.yaml
  github-pr-conflict-scout: workflows/github-pr-conflict-scout.yaml
  origin-sync: workflows/origin-sync.yaml
  workspace-cleanup: workflows/workspace-cleanup.yaml
scheduled_jobs:
  - id: github-pr-conflict-scout
    workflow: github-pr-conflict-scout
    enabled: true
    every: 15m
    overlap: skip
    catch_up: false
    on_failure:
      linear:
        enabled: true
        state: Triage
        dedupe: open_issue_per_job
  - id: origin-sync
    workflow: origin-sync
    enabled: true
    every: 15m
    overlap: skip
    catch_up: false
    on_failure:
      linear:
        enabled: true
        state: Triage
        dedupe: open_issue_per_job
  - id: workspace-cleanup
    workflow: workspace-cleanup
    enabled: true
    every: 1h
    overlap: skip
    catch_up: false
    on_failure:
      linear:
        enabled: true
        state: Triage
        dedupe: open_issue_per_job
artifact_limits:
  command_stream_max_chars: 20000
  template_field_max_chars: 8000
  workflow_summary_max_chars: 20000
linear_contract:
  enabled: true
  workflow_label_prefix: "workflow:"
  workflow_labels: [research, implementation, execplan, execplan-revision, execplan-implementation, merge-conflict-resolution]
  support_labels: [needs-workflow, needs-clarification]
  required_states:
    todo: Todo
    in_progress: In Progress
    in_review: In Review
    done: Done
    triage: Triage
  handoff_state_bindings:
    claim: in_progress
    failure: triage
  enforce_issue_workflow_labels: true
  invalid_workflow_state_id: 83eb55af-4c17-443f-9501-8a581be7de20
  comment_on_invalid_workflow: true

ui_server:
  # Disabled-by-default identity/config primitive. This does not open a live
  # browser UI or server transport in the current slice.
  enabled: false
  # endpoint: https://ui.example.test
  # enrollment_token_env: UI_SERVER_TOKEN
