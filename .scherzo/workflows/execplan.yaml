version: 1
id: execplan
description: Turn a Linear ticket into a reviewed ExecPlan under docs/plans, open a ready PR for review, and create the follow-up implementation issue.
max_parallel_steps: 1
steps:
  - id: draft_plan
    kind: agent
    prompt: prompts/execplan-draft.md
    workspace: main

  - id: validate_draft
    kind: command
    depends_on: [draft_plan]
    run: scripts/scherzo-execplan validate
    workspace: main
    on_failure: continue

  - id: repair_validation
    kind: agent
    depends_on: [validate_draft]
    prompt: prompts/execplan-repair-validation.md
    workspace: main

  - id: validate_after_repair
    kind: command
    depends_on: [repair_validation]
    run: scripts/scherzo-execplan validate
    workspace: main

  - id: review_plan
    kind: agent
    depends_on: [validate_after_repair]
    prompt: prompts/execplan-review.md
    workspace: main

  - id: incorporate_review
    kind: agent
    depends_on: [review_plan]
    prompt: prompts/execplan-incorporate-review.md
    workspace: main

  - id: final_validate
    kind: command
    depends_on: [incorporate_review]
    run: scripts/scherzo-execplan validate
    workspace: main

  - id: create_pr
    kind: command
    depends_on: [final_validate]
    run: scripts/scherzo-execplan create-pr
    timeout_ms: 300000
    workspace: main

  - id: create_implementation_issue
    kind: command
    depends_on: [create_pr]
    run: scripts/scherzo-execplan create-implementation-issue
    timeout_ms: 300000
    workspace: main
