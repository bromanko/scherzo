version: 1
id: implementation
description: Implement a focused Scherzo issue from ticket context, review it, validate it, publish a PR, and report the PR URL.
max_parallel_steps: 1
steps:
  - id: prepare_context
    kind: command
    run: 'repo_root=${SCHERZO_REPO_ROOT:-$(pwd -P | sed "s#/.scherzo/workspaces/.*##")}; "$repo_root/scripts/scherzo-implementation" prepare --source ticket'
    timeout_ms: 300000
    workspace: main

  - id: implement
    kind: agent
    depends_on: [prepare_context]
    prompt: prompts/implement.md
    workspace: main

  - id: analyze_changes
    kind: command
    depends_on: [implement]
    run: 'repo_root=${SCHERZO_REPO_ROOT:-$(pwd -P | sed "s#/.scherzo/workspaces/.*##")}; "$repo_root/scripts/scherzo-implementation" analyze'
    workspace: main

  - id: code_review
    kind: agent
    depends_on: [analyze_changes]
    prompt: prompts/code-review.md
    workspace: main

  - id: apply_feedback
    kind: agent
    depends_on: [code_review]
    prompt: prompts/apply-feedback.md
    workspace: main

  - id: final_validate
    kind: command
    depends_on: [apply_feedback]
    run: 'repo_root=${SCHERZO_REPO_ROOT:-$(pwd -P | sed "s#/.scherzo/workspaces/.*##")}; "$repo_root/scripts/scherzo-implementation" validate'
    timeout_ms: 1200000
    workspace: main

  - id: publish_pr
    kind: command
    depends_on: [final_validate]
    run: 'repo_root=${SCHERZO_REPO_ROOT:-$(pwd -P | sed "s#/.scherzo/workspaces/.*##")}; "$repo_root/scripts/scherzo-implementation" publish'
    timeout_ms: 300000
    workspace: main
