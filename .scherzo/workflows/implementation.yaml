version: 1
id: implementation
description: Implement a focused Scherzo issue from ticket context, review it, validate it, publish a PR, and report the PR URL.
max_parallel_steps: 1
steps:
  - id: prepare_context
    kind: command
    run: 'repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; "$repo_root/scripts/scherzo-implementation" prepare --source ticket'
    timeout_ms: 300000
    workspace: main

  - id: refresh_base_before_implementation
    kind: command
    depends_on: [prepare_context]
    run: 'repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; "$repo_root/scripts/scherzo-implementation" refresh-base --stage before-implementation'
    timeout_ms: 300000
    workspace: main

  - id: implement
    kind: agent
    depends_on: [refresh_base_before_implementation]
    prompt: prompts/implement.md
    workspace: main

  - id: analyze_changes
    kind: command
    depends_on: [implement]
    run: 'repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; "$repo_root/scripts/scherzo-implementation" analyze'
    workspace: main

  - id: code_review
    kind: agent
    depends_on: [analyze_changes]
    prompt: prompts/code-review.md
    workspace: main

  - id: apply_feedback
    kind: agent
    depends_on: [code_review]
    prompt: prompts/apply-feedback.md
    workspace: main

  - id: refresh_base_before_validation
    kind: command
    depends_on: [apply_feedback]
    run: 'repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; "$repo_root/scripts/scherzo-implementation" refresh-base --stage before-validation'
    timeout_ms: 300000
    on_failure: continue
    workspace: main

  - id: validate_after_refresh
    kind: command
    depends_on: [refresh_base_before_validation]
    run: 'repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; "$repo_root/scripts/scherzo-implementation" validate'
    timeout_ms: 1200000
    on_failure: continue
    workspace: main

  - id: repair_base_drift
    kind: agent
    depends_on: [validate_after_refresh]
    prompt: prompts/repair-base-drift.md
    workspace: main

  - id: final_validate
    kind: command
    depends_on: [repair_base_drift]
    run: 'repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; "$repo_root/scripts/scherzo-implementation" validate'
    timeout_ms: 1200000
    workspace: main

  - id: publish_pr
    kind: command
    depends_on: [final_validate]
    run: 'repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; "$repo_root/scripts/scherzo-implementation" publish'
    timeout_ms: 300000
    workspace: main
