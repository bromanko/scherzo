version: 1
id: execplan-implementation
description: Implement an existing ExecPlan, verify the plan is complete, review the changed files, validate, publish a PR, and clean up safely.
workspace_profile: dogfood-jj
max_parallel_steps: 1
steps:
  - id: prepare_plan
    kind: command
    run: 'repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; "$repo_root/scripts/scherzo-implementation" prepare --source execplan'
    timeout_ms: 300000
    workspace: main

  - id: refresh_base_before_implementation
    kind: command
    depends_on: [prepare_plan]
    run: 'repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; "$repo_root/scripts/scherzo-implementation" refresh-base --stage before-implementation'
    timeout_ms: 300000
    workspace: main

  - id: implement_plan
    kind: agent
    depends_on: [refresh_base_before_implementation]
    prompt: prompts/execplan-implementation-implement.md
    workspace: main

  - id: analyze_changes
    kind: command
    depends_on: [implement_plan]
    run: 'repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; "$repo_root/scripts/scherzo-implementation" analyze'
    workspace: main

  - id: verify_plan_completion
    kind: agent
    depends_on: [analyze_changes]
    prompt: prompts/execplan-implementation-verify-completion.md
    workspace: main

  - id: apply_plan_completion_feedback
    kind: agent
    depends_on: [verify_plan_completion]
    prompt: prompts/execplan-implementation-apply-plan-completion-feedback.md
    workspace: main

  - id: analyze_changes_after_plan_feedback
    kind: command
    depends_on: [apply_plan_completion_feedback]
    run: 'repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; "$repo_root/scripts/scherzo-implementation" analyze'
    workspace: main

  - id: verify_plan_completion_after_feedback
    kind: agent
    depends_on: [analyze_changes_after_plan_feedback]
    prompt: prompts/execplan-implementation-verify-completion-after-feedback.md
    workspace: main

  - id: gate_plan_completion
    kind: command
    depends_on: [verify_plan_completion_after_feedback]
    run: 'repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; "$repo_root/scripts/scherzo-implementation" gate-plan-completion'
    workspace: main

  - id: generate_review_brief
    kind: command
    depends_on: [gate_plan_completion]
    run: 'repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; "$repo_root/scripts/scherzo-review" dry-run --from @- --to @ --output-dir "$SCHERZO_RUN_ROOT/artifacts/review/generate_review_brief"'
    on_failure: continue
    workspace: main

  - id: correctness_review_lane
    kind: command
    depends_on: [generate_review_brief]
    run: 'repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; backend=${SCHERZO_STAGED_REVIEW_AGENT_BACKEND:-heuristic}; brief="$SCHERZO_RUN_ROOT/artifacts/review/generate_review_brief/review-brief.v1.json"; "$repo_root/scripts/scherzo-review" run-lane --lane correctness --brief "$brief" --from @- --to @ --output-dir "$SCHERZO_RUN_ROOT/artifacts/review/correctness_review_lane" --agent-backend "$backend"'
    on_failure: continue
    workspace: main

  - id: test_quality_review_lane
    kind: command
    depends_on: [generate_review_brief]
    run: 'repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; backend=${SCHERZO_STAGED_REVIEW_AGENT_BACKEND:-heuristic}; brief="$SCHERZO_RUN_ROOT/artifacts/review/generate_review_brief/review-brief.v1.json"; "$repo_root/scripts/scherzo-review" run-lane --lane test-quality --brief "$brief" --from @- --to @ --output-dir "$SCHERZO_RUN_ROOT/artifacts/review/test_quality_review_lane" --agent-backend "$backend"'
    on_failure: continue
    workspace: main

  - id: idioms_maintainability_review_lane
    kind: command
    depends_on: [generate_review_brief]
    run: 'repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; backend=${SCHERZO_STAGED_REVIEW_AGENT_BACKEND:-heuristic}; brief="$SCHERZO_RUN_ROOT/artifacts/review/generate_review_brief/review-brief.v1.json"; "$repo_root/scripts/scherzo-review" run-lane --lane idioms-maintainability --brief "$brief" --from @- --to @ --output-dir "$SCHERZO_RUN_ROOT/artifacts/review/idioms_maintainability_review_lane" --agent-backend "$backend"'
    on_failure: continue
    workspace: main

  - id: security_performance_review_lane
    kind: command
    depends_on: [generate_review_brief]
    run: 'repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; backend=${SCHERZO_STAGED_REVIEW_AGENT_BACKEND:-heuristic}; brief="$SCHERZO_RUN_ROOT/artifacts/review/generate_review_brief/review-brief.v1.json"; "$repo_root/scripts/scherzo-review" run-lane --lane security-performance --brief "$brief" --from @- --to @ --output-dir "$SCHERZO_RUN_ROOT/artifacts/review/security_performance_review_lane" --agent-backend "$backend"'
    on_failure: continue
    workspace: main

  - id: synthesize_review
    kind: command
    depends_on:
      - correctness_review_lane
      - test_quality_review_lane
      - idioms_maintainability_review_lane
      - security_performance_review_lane
    run: 'repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; brief="$SCHERZO_RUN_ROOT/artifacts/review/generate_review_brief/review-brief.v1.json"; "$repo_root/scripts/scherzo-review" synthesize --brief "$brief" --lane-result "$SCHERZO_RUN_ROOT/artifacts/review/correctness_review_lane/review-lane-correctness.v1.json" --lane-result "$SCHERZO_RUN_ROOT/artifacts/review/test_quality_review_lane/review-lane-test-quality.v1.json" --lane-result "$SCHERZO_RUN_ROOT/artifacts/review/idioms_maintainability_review_lane/review-lane-idioms-maintainability.v1.json" --lane-result "$SCHERZO_RUN_ROOT/artifacts/review/security_performance_review_lane/review-lane-security-performance.v1.json" --output-dir "$SCHERZO_RUN_ROOT/artifacts/review/synthesize_review"'
    workspace: main

  - id: review_changes
    kind: agent
    depends_on: [synthesize_review]
    prompt: prompts/execplan-implementation-review.md
    workspace: main

  - id: apply_review_feedback
    kind: agent
    depends_on: [review_changes]
    prompt: prompts/execplan-implementation-apply-feedback.md
    workspace: main

  - id: refresh_base_before_validation
    kind: command
    depends_on: [apply_review_feedback]
    run: 'repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; "$repo_root/scripts/scherzo-implementation" refresh-base --stage before-validation'
    timeout_ms: 300000
    on_failure: continue
    workspace: main

  - id: validate_after_refresh
    kind: command
    depends_on: [refresh_base_before_validation]
    run: 'repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; "$repo_root/scripts/scherzo-implementation" validate'
    timeout_ms: 1200000
    on_failure: continue
    workspace: main

  - id: repair_base_drift
    kind: agent
    depends_on: [validate_after_refresh]
    prompt: prompts/repair-base-drift.md
    workspace: main

  - id: verify_plan_completion_before_final_validation
    kind: agent
    depends_on: [repair_base_drift]
    prompt: prompts/execplan-implementation-verify-completion-before-final-validation.md
    workspace: main

  - id: final_validate
    kind: command
    depends_on: [verify_plan_completion_before_final_validation]
    run: 'repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; "$repo_root/scripts/scherzo-implementation" validate'
    timeout_ms: 1200000
    workspace: main

  - id: final_plan_completion_gate
    kind: command
    depends_on: [final_validate]
    run: 'repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; "$repo_root/scripts/scherzo-implementation" gate-plan-completion --final'
    workspace: main

  - id: publish_pr
    kind: command
    depends_on: [final_plan_completion_gate]
    run: 'repo_root=${SCHERZO_REPO_ROOT:-$(cd "$SCHERZO_CONFIG_DIR/.." && pwd -P)}; "$repo_root/scripts/scherzo-implementation" publish'
    timeout_ms: 300000
    workspace: main
